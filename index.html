<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FSU</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FSU">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html{color-scheme:light dark}
html.theme-dark{color-scheme:dark}
html.theme-light{color-scheme:light}
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F7F7FA;
  --ink:#000000;--ink2:#6C6C70;--ink3:#8E8E93;
  --line:#D8D8DC;--line2:#E8E8ED;
  --blue:#0A62C4;--bluebg:#E8F0FB;
  --red:#D62B20;--redbg:#FDECEA;--redsolid:#D93A2E;
  --amber:#A96400;--amberbg:#FDF2E0;--ambersolid:#E8890B;
  --green:#1E8A45;--greenbg:#E7F5EC;--greensolid:#22A153;
  --grey:#8E8E93;--greybg:#EFEFF2;
  --dark:#22262B;--darkink:#FFFFFF;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --cw:1760px;
  --top:calc(100px + env(safe-area-inset-top));
  --bot:calc(74px + env(safe-area-inset-bottom));
}
/* dark applies automatically, unless the person has chosen otherwise */
@media (prefers-color-scheme:dark){html:not(.theme-light){
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;
  --ink:#FFFFFF;--ink2:#AEAEB2;--ink3:#8E8E93;
  --line:#38383A;--line2:#2C2C2E;
  --blue:#57A6FF;--bluebg:#132A44;
  --red:#FF6B5E;--redbg:#3A1B18;--redsolid:#C7382C;
  --amber:#F0A93B;--amberbg:#3A2A10;--ambersolid:#B87209;
  --green:#4CD07D;--greenbg:#13301F;--greensolid:#1C8746;
  --grey:#8E8E93;--greybg:#2C2C2E;
  --dark:#3A3F45;--darkink:#FFFFFF;
}}
html.theme-dark{
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;
  --ink:#FFFFFF;--ink2:#AEAEB2;--ink3:#8E8E93;
  --line:#38383A;--line2:#2C2C2E;
  --blue:#57A6FF;--bluebg:#132A44;
  --red:#FF6B5E;--redbg:#3A1B18;--redsolid:#C7382C;
  --amber:#F0A93B;--amberbg:#3A2A10;--ambersolid:#B87209;
  --green:#4CD07D;--greenbg:#13301F;--greensolid:#1C8746;
  --grey:#8E8E93;--greybg:#2C2C2E;
  --dark:#3A3F45;--darkink:#FFFFFF;
}
html.theme-light{  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F7F7FA;
  --ink:#000000;--ink2:#6C6C70;--ink3:#8E8E93;
  --line:#D8D8DC;--line2:#E8E8ED;
  --blue:#0A62C4;--bluebg:#E8F0FB;
  --red:#D62B20;--redbg:#FDECEA;--redsolid:#D93A2E;
  --amber:#A96400;--amberbg:#FDF2E0;--ambersolid:#E8890B;
  --green:#1E8A45;--greenbg:#E7F5EC;--greensolid:#22A153;
  --grey:#8E8E93;--greybg:#EFEFF2;
  --dark:#22262B;--darkink:#FFFFFF;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --cw:1760px;
  --top:calc(100px + env(safe-area-inset-top));
  }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sys);
  font-size:17px;line-height:1.4;padding-top:var(--top);padding-bottom:var(--bot);
  overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}

.hdr{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--card);
  border-bottom:.5px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 12px}
.titlerow{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
.hdr h1{font-size:28px;font-weight:700;letter-spacing:-.022em;margin:0;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gear{background:none;border:0;color:var(--blue);padding:4px;flex:0 0 auto}
#gear svg{width:23px;height:23px;display:block}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card2);
  border:.5px solid var(--line2);border-radius:10px;padding:9px 12px}
.sbox input{border:0;background:none;outline:none;flex:1;padding:0;font-size:16px}
.sbox input::placeholder{color:var(--ink3)}
.sbox svg{width:17px;height:17px;color:var(--ink3);flex:0 0 auto}
.sbox button{background:none;border:0;color:var(--blue);font-size:15px;padding:0 2px}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--bg);
  border-top:.5px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);
  gap:5px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
/* each tab reads as a button, like everything else in the app */
.tabs button{background:var(--card);border:.5px solid var(--line);border-radius:11px;
  padding:7px 2px 6px;color:var(--ink3);
  font-size:9.5px;display:flex;flex-direction:column;align-items:center;gap:3px;
  min-width:0;overflow:hidden;min-height:50px;justify-content:center;position:relative}
.tabs button:active{background:var(--card2)}
.tdot{position:absolute;top:3px;left:50%;margin-left:5px;min-width:15px;height:15px;
  border-radius:8px;background:var(--amber);color:#1a1200;font-size:9.5px;font-weight:800;
  font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 3px}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:360px){ .tabs{gap:4px;padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
  .tabs button{font-size:8.5px;border-radius:9px} .tabs .g{width:19px;height:19px} }
.tabs button[aria-current=true]{color:var(--blue);background:var(--bluebg);
  border-color:var(--blue)}
.g{width:22px;height:22px;display:block}

.side{display:none}
.view{display:none;padding:14px 16px 30px}
.view.on{display:block}


body.wide{padding:0;display:grid;grid-template-columns:232px minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);min-height:100vh}
body.wide .side{grid-column:1;grid-row:1 / -1}
body.wide .hdr{grid-column:2;grid-row:1;
  padding-left:calc(max(0px,(100% - var(--cw))/2) + 28px);
  padding-right:calc(max(0px,(100% - var(--cw))/2) + 28px)}
body.wide .main{grid-column:2;grid-row:2;align-self:start;
  max-width:var(--cw);margin:0 auto;width:100%}
body.wide .tabs{display:none}
body.wide .hdr{position:sticky;grid-column:2;
  padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:14px}
body.wide .titlerow{margin:6px 0 12px}
body.wide .hdr h1{font-size:30px}
body.wide .side{display:flex;flex-direction:column;gap:2px;background:var(--card);
    border-right:.5px solid var(--line);padding:calc(20px + env(safe-area-inset-top)) 0 20px;
    position:sticky;top:0;height:100vh}
body.wide .side button{background:none;border:0;color:var(--ink3);padding:12px 4px;
    font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px}
body.wide .side button[aria-current=true]{color:var(--blue)}
body.wide .side .g{width:24px;height:24px}
body.wide .main{grid-column:2;min-width:0;padding-bottom:40px}
body.wide .view{padding:6px 28px 60px}
body.wide .demobar{border-radius:10px;
  margin-left:calc(max(0px,(100% - var(--cw))/2) + 28px);
  margin-right:calc(max(0px,(100% - var(--cw))/2) + 28px)}


/* ---------- priority strip ---------- */
.strip{display:flex;flex-direction:column;gap:10px}

body.wide .strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;
  border-radius:14px;padding:15px 16px;color:#fff}
.pcard:active{opacity:.9}
.pcard .n{display:block;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.18}
.pcard .s{display:block;font-size:13.5px;opacity:.92;margin-top:3px;line-height:1.3}
.pcard .ch{margin-left:auto;font-size:20px;opacity:.85}
.pcard svg{width:22px;height:22px;flex:0 0 auto}
.p-red{background:var(--redsolid)}
.p-amber{background:var(--ambersolid)}
.p-dark{background:var(--dark);color:var(--darkink)}
.p-green{background:var(--greensolid)}

body.wide .pcard{flex-direction:column;align-items:flex-start;gap:6px;padding:18px;min-height:118px}
body.wide .pcard .n{font-size:34px}
body.wide .pcard .ch{display:none}
body.wide .pcard svg{width:24px;height:24px;margin-bottom:2px}


.skmain{min-width:0}
body.skfull{overflow:hidden}
body.skfull .skgrid.full{position:fixed;inset:0;z-index:80;background:var(--bg);
  padding:10px;gap:10px;display:grid;grid-template-rows:minmax(0,1fr) auto;
  grid-template-columns:minmax(0,1fr);overflow:hidden;
  align-items:stretch;align-content:stretch}
.skgrid.full .skmain{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.skgrid.full .canvaswrap{margin:0 auto;padding:0;overflow:hidden;flex:0 0 auto}
.skgrid.full .skcanvas{width:100%;height:100%;display:block}
.skgrid.full .skrail{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.skgrid.full .editbar{margin:0;flex:0 0 auto}
.skgrid.full .inkrow{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
.inkrow .inklab{font-size:12.5px;color:var(--ink2);margin-right:2px}
.ink{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0;flex:0 0 auto}
.ink.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--bluebg)}
.objset{flex:0 0 auto;max-height:32vh;overflow-y:auto}
.skgrid.full .cdhead,.skgrid.full .back{display:none}
@media (max-width:899px){ .skgrid.full .skrail{max-height:38vh} }
body.skfull .skgrid.full.notools{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.skgrid.full.notools .skrail,.skgrid.full.notools .objset{display:none}
@media (min-width:900px){
  body.skfull .skgrid.full{grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:minmax(0,1fr)}
  .skgrid.full .skrail{max-height:100%}
}
.editbar button[disabled]{opacity:.38}
.editbar button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.canvaswrap{background:var(--card);border:.5px solid var(--line);border-radius:12px;
  padding:6px;margin-bottom:10px;touch-action:none}
.skcanvas{width:100%;height:auto;display:block;border-radius:8px;touch-action:none;
  -webkit-user-select:none;user-select:none}
.k-line{fill:none;stroke:var(--kc,#111);stroke-width:2.5}
.k-thin{fill:none;stroke:var(--kc,#111);stroke-width:1.2}
.k-thick{fill:none;stroke:var(--kc,#111);stroke-width:4;stroke-linecap:round}
.k-stroke{fill:none;stroke:var(--kc,#111);stroke-width:2}
.k-dash{fill:none;stroke:var(--kc,#111);stroke-width:2;stroke-dasharray:8 6}
.k-solid{fill:var(--kc,#111);stroke:none}
.k-fill{fill:var(--kc,#111);stroke:none}
.k-text{fill:var(--kc,#111);font-family:var(--sys);font-weight:600}
.k-tag,.k-label,.k-text{paint-order:stroke fill;stroke:#fff;stroke-width:3.2px;
  stroke-linejoin:round}
.k-tag{fill:var(--kc,#111);font-family:var(--sys);font-size:15px;text-anchor:middle}
.k-lead{stroke:var(--kc,#111);stroke-width:1;opacity:.55}
.hcase{fill:#111;font-family:var(--sys);font-size:27px;font-weight:700;letter-spacing:-.5px}
.haddr{fill:#111;font-family:var(--sys);font-size:16px}
.hmeta{fill:#444;font-family:var(--sys);font-size:14px}
.tbbox{stroke:#111;stroke-width:1.6;fill:none}
.tbrule{stroke:#999;stroke-width:.8}
.tbunit{font-family:var(--sys);font-size:7.6px;font-weight:700;letter-spacing:.03em;fill:#111}
.tblab{font-family:var(--sys);font-size:7.5px;font-weight:700;letter-spacing:.07em;fill:#666}
.tbval{font-family:var(--sys);font-size:11.5px;fill:#111}
.tbbig{font-family:var(--sys);font-size:17px;font-weight:700;fill:#111}
.k-credit{fill:#555;font-family:var(--sys);font-size:9.5px}
.k-dim{stroke:var(--kc,#111);stroke-width:1.6;fill:none}
.k-dimbg{fill:#fff;stroke:var(--kc,#111);stroke-width:.8}
.k-dimt{fill:var(--kc,#111);font-family:var(--sys);font-size:10px;font-weight:600}
.k-pnum{fill:#111;font-family:var(--sys);font-size:11px;font-weight:700}
.k-num{fill:var(--kc,#111);font-family:var(--sys);font-size:22px;font-weight:800;text-anchor:middle}
.k-sel{fill:none;stroke:#0A62C4;stroke-width:2.5;stroke-dasharray:7 5}
.k-handle{fill:#0A62C4;stroke:#fff;stroke-width:2.5}
.k-rot{fill:#0A62C4;stroke:#fff;stroke-width:2.5;cursor:grab}
.k-rotstem{stroke:#0A62C4;stroke-width:2;stroke-dasharray:3 3}
.skhead{pointer-events:none}
.k-legt{fill:var(--kc,#111);font-family:var(--sys);font-weight:700}
.k-legn{fill:var(--kc,#111);font-family:var(--sys);font-weight:700}
.k-legr{fill:var(--kc,#111);font-family:var(--sys)}
.k-legu{fill:#8a8a8a;font-family:var(--sys);font-style:italic}
.laygrp{border:.5px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
.laygrp.cur{border-color:var(--blue)}
.layhead{display:flex;align-items:center;gap:4px;background:var(--card2,var(--card));
  padding:3px 4px 3px 0;border-bottom:.5px solid var(--line)}
.layhead .laypick{font-weight:700}
.laycount{margin-left:auto;font-size:11.5px;color:var(--ink3);padding:0 8px}
.layb.lockon{color:var(--amber)}
.laybig{background:none;border:0;color:var(--ink3);min-width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.laybig.lockon{color:var(--amber)}
.layhead .laypick,.lay .laypick{min-height:46px}
.laycount{margin-left:0;font-size:11.5px;color:var(--ink3);padding:0;display:block}
.layhead .laypick{flex-direction:column;align-items:flex-start;gap:1px;padding:7px 12px}
.lki{width:15px;height:15px;display:block;margin:0 auto}
.lay.locked{opacity:.55}
.osclose{background:none;border:0;color:var(--ink3);font-size:22px;line-height:1;
  padding:0 2px 0 10px;margin-left:auto}
.addlay{background:var(--bluebg);border:.5px solid var(--blue);border-radius:10px;
  color:var(--blue);font-family:var(--sys);font-size:13px;font-weight:600;
  padding:11px 14px;min-height:44px;text-transform:none;letter-spacing:0;margin-left:auto}
.sect:has(.addlay){display:flex;align-items:center;gap:10px}
.layers{background:var(--card);border:.5px solid var(--line2);border-radius:11px;overflow:hidden}
.lay{display:flex;align-items:center;border-bottom:.5px solid var(--line2)}
.lay:last-child{border-bottom:0}
.lay.on{background:var(--bluebg)}
.laypick{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:none;border:0;
  padding:7px 4px 7px 9px;text-align:left}
.lay .lp{width:40px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.lay .lp .pvs{width:38px;height:24px}
.lay .ln2{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layb{background:none;border:0;color:var(--ink3);font-size:12px;padding:8px 5px;flex:0 0 auto}
.layb.del{color:var(--red);font-size:17px;padding-right:9px}
.layb[disabled]{opacity:.25}
@media (hover:hover) and (pointer:fine){.layb:hover:not([disabled]){color:var(--blue)}
  .laypick:hover{background:var(--card2)}}
.objset{background:var(--card);border:.5px solid var(--line2);border-radius:12px;padding:12px 13px}
.oshead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.oshead b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.oshead .osr{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.oshead .osr span{font-family:var(--mono);color:var(--ink)}
.osgrid{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:end}
.osgrid .osname{grid-column:1/-1}
.osgrid .osnum+.osname{grid-column:2}
.osgrid .fld{margin:0}
.objbar{margin-top:10px;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.objbar button{flex:0 0 auto;background:var(--card);border:.5px solid var(--line);
  border-radius:9px;padding:10px 13px;font-size:14px;font-weight:600;color:var(--blue);white-space:nowrap}
.objbar button.danger{color:var(--red);border-color:var(--red)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-bottom:6px}
.steps{margin:0;padding-left:20px;color:var(--ink2);font-size:14px;line-height:1.55}
.steps li{margin-bottom:7px}
.steps b{color:var(--ink)}
.numnext{background:var(--bluebg);border:.5px solid var(--blue);border-radius:10px;
  color:var(--blue);font-size:13.5px;font-weight:600;padding:9px 12px;align-self:end;white-space:nowrap}
.sugbox{display:flex;flex-direction:column;gap:0;margin:-6px 0 12px}
.sugbox:empty{display:none}
.sug{background:var(--card);border:.5px solid var(--line);border-top:0;color:var(--ink);
  font-family:var(--sys);font-size:14.5px;text-align:left;padding:13px 14px;min-height:46px}
.sug:first-child{border-top:.5px solid var(--line);border-radius:11px 11px 0 0}
.sug:last-child{border-radius:0 0 11px 11px}
.sug:only-child{border-radius:11px}
.tidylist{display:flex;flex-direction:column;gap:9px}
.tidyrow{background:var(--card);border:.5px solid var(--line);border-radius:12px;
  padding:11px 13px;display:grid;grid-template-columns:1fr 88px;gap:8px 12px;align-items:end}
.tidyrow .tn{grid-column:1/-1}
.tidyrow .tn b{display:block;font-size:15px}
.tidyrow .tn span{font-size:12.5px;color:var(--ink3)}
.tidyrow .fld{margin:0}
@media (min-width:700px){ .tidyrow{grid-template-columns:1fr 110px 230px}
  .tidyrow .tn{grid-column:auto} }
.palsearch{position:relative;margin:0 0 10px}
.palsearch input{width:100%;padding:10px 34px 10px 12px;font-size:15px}
.palsearch button{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:none;border:0;color:var(--ink3);font-size:20px;padding:0 6px}
.palette .pg{display:block;font-size:10px;color:var(--ink3);margin-top:1px}
.palette button{background:var(--card);border:.5px solid var(--line2);border-radius:11px;
  padding:9px 5px 7px;display:flex;flex-direction:column;align-items:center;gap:5px}
.palette .pv{height:32px;display:flex;align-items:center;justify-content:center}
.pvs{width:46px;height:32px;display:block;overflow:visible}
.palette .pn{font-size:11.5px;color:var(--ink2);text-align:center;line-height:1.2}
@media (prefers-color-scheme:dark){.pvs .k-line,.pvs .k-stroke,.pvs .k-thin,.pvs .k-thick,.pvs .k-dash{stroke:#ddd}
 .pvs .k-solid,.pvs .k-fill{fill:#ddd}.pvs .k-text{fill:#ddd}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--greybg);
  border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{background:none;border:0;padding:8px 6px;border-radius:7px;
  font-size:14.5px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.plotwrap{background:var(--card);border:.5px solid var(--line2);border-radius:14px;
  padding:10px;margin-bottom:6px;overflow-x:auto}
.plot{width:100%;height:auto;display:block}
.plot .gl{stroke:var(--line2);stroke-width:1}
.plot .pf{fill:none;stroke:var(--line);stroke-width:1}
.plot .rp{fill:var(--ink2)}
.plot .rt{fill:var(--ink2);font-size:10px;font-family:var(--sys)}
.plot .ip{fill:var(--blue)}
.plot .in{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle;font-family:var(--sys)}
.plot .na{stroke:var(--ink2);stroke-width:1.5}
.plot .naf{fill:var(--ink2)}
.sweepcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:.5px solid var(--line2);border-radius:14px;padding:14px 16px;margin-top:10px}
.sweepcard .n{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.sweepcard .s{display:block;font-size:13.5px;color:var(--ink2);margin-top:2px}
.sweepcard .ch{margin-left:auto;color:var(--ink3);font-size:18px}
.sweepcard.live{border-color:var(--amber);background:var(--amberbg)}
.sweepcard.live .n{color:var(--amber)}
.sweepcard.live .s{color:var(--amber);opacity:.9}
.sect{font-size:13px;font-weight:600;color:var(--ink2);margin:24px 2px 9px}
.subsect{font-size:12.5px;font-weight:600;color:var(--ink3);margin:16px 2px 7px}
.qf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qf button{background:var(--card);border:.5px solid var(--line2);border-radius:12px;
  padding:12px 11px;text-align:left;min-height:84px;display:flex;flex-direction:column}
.qf .nm{font-size:14px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.qf .lc{font-size:13px;color:var(--blue);font-weight:600;margin-top:auto;padding-top:8px}

/* ---------- rows ---------- */
.rows{background:var(--card);border-radius:12px;border:.5px solid var(--line2);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;
  border:0;border-bottom:.5px solid var(--line2);padding:13px 14px}
.row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.row .code{font-size:16.5px;font-weight:600;letter-spacing:-.01em;display:block}
.row .desc{font-size:13.5px;color:var(--ink2);margin-top:1px;display:block}
.row .rt{margin-left:auto;display:flex;align-items:center;gap:9px;flex:0 0 auto}
.badge .bico{width:14px;height:14px;flex:0 0 auto;margin-right:5px;vertical-align:-2px}
.badge.b-unchecked .bico{color:var(--amber)}
.cdtags .badge{display:inline-flex;align-items:center;font-size:13px;padding:6px 13px;
  border-radius:20px;font-weight:600}
.badge{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-action{background:var(--redbg);color:var(--red)}
.b-attn{background:var(--amberbg);color:var(--amber)}
.b-good{background:var(--greenbg);color:var(--green)}
.b-unchecked{background:var(--greybg);color:var(--grey)}
.b-req{background:var(--bluebg);color:var(--blue)}
.links{background:var(--card);border:.5px solid var(--line2);border-radius:12px;overflow:hidden}
.lnk{display:block;padding:12px 14px;border-bottom:.5px solid var(--line2);
  text-decoration:none;color:inherit}
.lnk:last-child{border-bottom:0}
.lnk .ln{display:block;font-size:15px;font-weight:500;color:var(--blue);line-height:1.3}
.lnk .lu{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.chev{color:var(--ink3);font-size:16px}

/* ---------- van walls ---------- */
.wall{margin-bottom:14px;container-type:inline-size;container-name:wall}
.slot.small{padding:2px 4px;gap:0}
.slot.small .code{font-size:11px;line-height:1.1}
.slot.small .st{font-size:9.5px;line-height:1.1}
.slot.tiny{padding:0 1px;gap:0;border-radius:2px;align-items:center;justify-content:center}
.slot.small{border-radius:4px}
.slot.tiny .code{font-size:9.5px;line-height:1}
.wallhead{display:flex;align-items:center;gap:10px}
.wallhead b{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.wallhead .cnt{font-size:12.5px;color:var(--ink3);font-weight:400}
.wallhead .wtags{margin-left:auto;display:flex;gap:5px}
.wallhead .badge{padding:2px 8px}
.vanwrap.mirrored .vanbody{transform:scaleX(-1)}
.vanwrap.mirrored .cargo{transform:scaleX(-1)}
.vanwrap{position:relative;aspect-ratio:2.55/1;max-height:420px;margin-bottom:4px}
@media (max-width:820px){ .vanwrap{aspect-ratio:1.62/1;max-height:none} }
.vanbody{position:absolute;left:0;right:0;top:0;height:87%;z-index:1;background:var(--ink3);
  clip-path:polygon(0% 92%,0% 64%,2% 42%,9% 38%,17% 0%,100% 0%,100% 92%)}
.vaninner{position:absolute;inset:0;background:var(--card2);
  clip-path:polygon(1% 90%,1% 65%,3% 43.5%,9.6% 39.5%,17.9% 1.6%,99% 1.6%,99% 90%)}
.wheel{position:absolute;border-radius:50%;background:var(--card2);
  border:2.5px solid var(--ink3);height:19%;aspect-ratio:1;width:auto;top:71%}
.wheel.f{left:8%}.wheel.r{left:76%}
.cargo{position:absolute;left:19%;right:2.5%;top:7%;bottom:13%;display:grid;gap:3px;overflow:hidden}
.slot{border-radius:6px;padding:4px 5px;text-align:left;border:.5px solid transparent;
  overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0;gap:1px;
  container-type:size;container-name:slot}
.slot>span{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.slot .code{font-size:11.5px;font-weight:700;letter-spacing:-.01em;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.slot .dsc{font-size:10px;opacity:.85;line-height:1.2;margin-top:1px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;min-height:0}
.slot .dsc.two{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;text-overflow:clip}
.slot .st{font-size:10px;font-weight:600;line-height:1.2;margin-top:auto;flex:0 0 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-action{background:var(--redbg);color:var(--red);border-color:var(--red)}
.s-attn{background:var(--amberbg);color:var(--amber);border-color:var(--amber)}
.s-good{background:var(--greenbg);color:var(--green);border-color:var(--green)}
.s-unchecked{background:var(--greybg);color:var(--grey);border-color:var(--line)}
.slot.sel{outline:2.5px solid var(--blue);outline-offset:1px}
.orient{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin:0 2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:4px 2px 16px;font-size:12.5px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:block}
.demobar{background:var(--amberbg);color:var(--amber);padding:11px 16px;font-size:13px;
  display:flex;align-items:center;gap:12px;line-height:1.35}
.demobar span{flex:1;min-width:0}
.demobar.warn{background:var(--amberbg);color:var(--amber)}
.demobar.warn button{background:var(--amber);color:var(--card)}
.demobar.bad{background:var(--redbg);color:var(--red)}
.demobar.bad button{background:var(--red);color:#fff}
.chips button i{display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:7px;vertical-align:1px;background:var(--grey)}
.chips button.ch-good i{background:var(--green)}
.chips button.ch-attn i{background:var(--amber)}
.chips button.ch-action i{background:var(--red)}
.chips button.ch-unchecked i{background:var(--grey)}
.chips button.on i{background:#fff}
.demobar button{margin-left:auto;background:var(--amber);color:var(--card);border:0;
  border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;flex:0 0 auto}
.bayhead{display:grid;grid-template-columns:minmax(0,1fr) 122px;
  gap:6px 16px;align-items:start;
  background:var(--card);border:.5px solid var(--line2);border-radius:20px;
  padding:18px 20px;margin-bottom:13px;width:100%;text-align:left;
  color:inherit;font-family:inherit}
.bayinfo{min-width:0;grid-column:1;grid-row:1}
.bayinfo h2{font-size:22px;font-weight:800;letter-spacing:-.025em;margin:0 0 4px;line-height:1.15}
.bayinfo .sub{font-size:14.5px;color:var(--ink2);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){ .bayinfo .sub{font-size:13.5px} .bayinfo h2{font-size:20px} }
@media (max-width:360px){
  .bayhead{grid-template-columns:minmax(0,1fr) 96px;padding:15px 16px;gap:5px 12px}
  .bayinfo .sub{font-size:12.5px}
}
.bayhead .vankey{grid-column:2;grid-row:1;align-self:center}
.vankey .vanwrap{aspect-ratio:2.55/1;max-height:none;margin:0}
.vankey .here{background:var(--red);border:1px solid rgba(255,255,255,.85);border-radius:3px;
  box-shadow:0 0 12px 3px rgba(255,107,94,.55)}
.keyends{display:flex;justify-content:space-between;font-size:9px;color:var(--ink3);
  font-family:var(--mono);margin-top:4px;white-space:nowrap}
.bayhead .cdtags{grid-column:1/-1;grid-row:2;justify-content:center;margin-top:10px}
.bayhead.mini{grid-template-columns:minmax(0,1fr) 88px;padding:12px 14px;
  margin-bottom:14px;border-radius:16px;gap:5px 12px}
.bayhead.mini .bayinfo h2{font-size:18px}
.bayhead.mini .bayinfo .sub{font-size:12.5px}
.bayhead.mini .cdtags{margin-top:8px}
.bayhead.mini .badge{font-size:11px;padding:4px 11px}
@media (hover:hover) and (pointer:fine){.bayhead:hover{border-color:var(--line)}}
.cdtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bayplan{display:grid;gap:5px;margin-top:14px;
  grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  grid-template-rows:repeat(var(--rows),minmax(0,1fr));
  aspect-ratio:calc(var(--cols)/var(--rows)*0.72)}
.bcell{border-radius:9px;padding:6px 7px;text-align:left;overflow:hidden;min-width:0;min-height:0;
  display:flex;flex-direction:column;justify-content:center;gap:1px;
  border:1px solid var(--line);background:var(--card);
  container-type:size;container-name:bcell}
.bcell .bc{font-size:13px;font-weight:700;letter-spacing:-.01em;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcell .bn{font-size:11px;color:var(--ink2);line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcell .bn.un{font-style:italic;color:var(--ink3)}
.bcell.s-good{background:var(--greenbg);border-color:var(--green)}
.bcell.s-attn{background:var(--amberbg);border-color:var(--amber)}
.bcell.s-action{background:var(--redbg);border-color:var(--red)}
.bcell .bn{display:none}
@container bcell (min-width:40px){ .bcell .bn{display:block} }
@container bcell (max-width:44px){ .bcell{padding:4px 4px} .bcell .bc{font-size:11px} }
@container bcell (max-width:30px){ .bcell .bc{font-size:9.5px;letter-spacing:-.3px} }
@container bcell (max-height:22px){ .bcell .bc{font-size:10.5px;line-height:1} .bcell .bn{display:none} }
.cdhead{background:var(--card);border:.5px solid var(--line2);border-radius:14px;padding:16px;margin-bottom:14px}
.cdhead h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.cdhead .sub{font-size:14.5px;color:var(--ink2);margin-top:2px}
.cdstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.back{background:var(--card);border:.5px solid var(--line);border-radius:11px;
  color:var(--blue);font-size:15px;font-weight:600;padding:11px 16px;
  margin:0 0 14px;display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;flex:0 0 auto}
@media (hover:hover) and (pointer:fine){.back:hover{border-color:var(--blue)}}
.acts{display:flex;gap:8px;margin-bottom:16px}
.acts button{flex:1;padding:12px 4px;font-size:13.5px;border-radius:11px;border:.5px solid var(--line);
  background:var(--card);color:var(--blue);font-size:14.5px;font-weight:600}
.ph.ok{background:var(--greenbg);color:var(--green)}
.ph{background:var(--bluebg);color:var(--blue);border-radius:10px;padding:11px 13px;
  font-size:13px;line-height:1.5;margin-bottom:12px}
.editbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.editbar button{flex:1 1 auto;min-width:112px;padding:10px 8px;border-radius:10px;
  border:.5px solid var(--line);background:var(--card);color:var(--blue);
  font-size:14.5px;font-weight:600}
@media (max-width:520px){ .editbar button{font-size:13.5px;min-width:96px;padding:9px 6px} }
.editbar button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.four label{display:block}
.four span{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.four input{width:100%;padding:9px 6px;text-align:center;background:var(--card2);
  border:.5px solid var(--line);border-radius:8px;color:var(--ink)}

body.wide .walls{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
body.wide .wall{min-width:0}


body.wide .cargo{left:20%}
body.wide .slot .dsc, body.wide .slot .st{font-size:11px}
body.wide .slot .code{font-size:13px}
body.wide .slot .dsc, body.wide .slot .st{font-size:11px}


.empty{border:1px dashed var(--line);border-radius:12px;padding:30px 20px;text-align:center;color:var(--ink2)}
.empty strong{display:block;font-size:17px;color:var(--ink);margin-bottom:6px;font-weight:600}
.empty p{margin:0 auto;max-width:36ch;font-size:14.5px;line-height:1.5}
.btn{display:block;width:100%;max-width:320px;margin:16px auto 0;padding:13px;border:0;
  border-radius:11px;background:var(--blue);color:#fff;font-size:16px;font-weight:600}
.btn:active{opacity:.85}
.btn.sec{background:var(--card);color:var(--blue);border:.5px solid var(--line)}
.fld{display:block;margin-bottom:14px}
/* short fields pack across the top so the table gets the room */
.fgrid{display:grid;grid-template-columns:1fr;gap:0 14px}
.fgrid .fld{margin-bottom:12px}
@media (min-width:700px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1080px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* narrative boxes are wider than a field but do not need the whole page */
.fgrid.narr{grid-template-columns:1fr}
@media (min-width:820px){.fgrid.narr{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fgrid.narr textarea{min-height:96px}
.fld.wide{margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;padding:11px 12px;background:var(--card);
  border:.5px solid var(--line);border-radius:10px;appearance:none;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:.5px solid var(--line2);border-radius:12px;padding:14px;max-width:600px}
.nowbar{display:flex;align-items:center;gap:12px;background:var(--card);
  border:.5px solid var(--line2);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.nowinfo{min-width:0;flex:1}
.nowinfo .nc{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;font-family:var(--mono)}
.nowinfo .nd{display:block;font-size:13px;color:var(--ink2);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowsw{flex:0 0 auto;background:var(--card2);border:.5px solid var(--line);border-radius:10px;
  color:var(--blue);font-size:14px;font-weight:600;padding:9px 14px}
.acttile{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:6px 12px;
  align-items:start;background:var(--card);border:.5px solid var(--line2);border-radius:20px;
  padding:18px 20px;margin-bottom:13px;width:100%;text-align:left;color:inherit;font-family:inherit}
.acttile .ai{min-width:0;grid-column:1;grid-row:1}
.acttile h2{font-size:22px;font-weight:800;letter-spacing:-.025em;margin:0 0 4px;line-height:1.15}
.acttile .sub{font-size:14.5px;color:var(--ink2);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acttile .ak{grid-column:2;grid-row:1;color:var(--ink3)}
.acttile .ak .dg{width:28px;height:28px;display:block}
.acttile .am{grid-column:1/-1;grid-row:2;display:flex;gap:6px;flex-wrap:wrap;

.acttile .badge{font-size:12.5px;padding:5px 12px;border-radius:20px;font-weight:600}
@media (max-width:420px){ .acttile h2{font-size:20px} .acttile .sub{font-size:13.5px} }
.doctabs{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;

.doctab{flex:0 0 auto;background:var(--card);border:.5px solid var(--line);border-radius:11px;

.doctab .dgw{flex:0 0 auto;color:var(--ink3);display:block}

.doctab .dtx{min-width:0}

  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.doctab.on .dc{color:var(--blue)}
.doctab.on .dt{color:var(--blue);opacity:.8}
.modebar{display:flex;gap:0;background:var(--card2);border-radius:11px;padding:3px;margin-bottom:14px}
.modebar button{flex:1;background:none;border:0;border-radius:9px;padding:9px 6px;
  font-size:14px;font-weight:600;color:var(--ink2)}
.modebar button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.justrow{display:flex;align-items:center;gap:9px;background:var(--card2);border-radius:10px;

.justrow.dup{box-shadow:inset 3px 0 0 var(--amber)}
.justrow .jdup{display:block;font-size:11.5px;color:var(--amber);font-weight:600;margin-top:1px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

  border-radius:9px;padding:9px 12px;color:var(--ink)}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:120;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:121;background:var(--bg);

  border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;
  padding:14px 16px calc(20px + env(safe-area-inset-bottom));

.sheet.on{transform:translateY(0);pointer-events:auto;visibility:visible}

.sheet h3{margin:2px 0 14px;font-size:19px;font-weight:700;letter-spacing:-.01em}
.grab{width:36px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 12px}

.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;

.idsect{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:22px 2px 9px}

  border:.5px solid var(--line2);border-radius:12px;overflow:hidden}
.loc .lft{padding:13px 14px}

/* ---------- slot contents sized to the slot itself ----------
   container queries measure the CONTENT box, rules inside one cannot style
   the container itself, and these must outrank the body.wide font sizes,
   hence the .wall prefix                                                  */
.wall .cargo .slot .dsc,.wall .cargo .slot .st{display:none}
.wall .cargo .slot .code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@container slot (min-height:22px){ .wall .cargo .slot .st{display:block} }
@container slot (max-width:60px){ .wall .cargo .slot .st{display:none} }

/* tall enough to stack the name under the code */
@container slot (min-width:54px) and (min-height:34px){
  .wall .cargo .slot .dsc{display:-webkit-box;-webkit-line-clamp:1;white-space:normal}
}
@container slot (min-width:54px) and (min-height:52px){
  .wall .cargo .slot .dsc{-webkit-line-clamp:2}
}
/* a drawer front: wide and shallow, so the name sits beside the code */
@container slot (min-width:60px) and (min-height:13px) and (max-height:30px){
  .wall .cargo .slot>span{flex-direction:row;align-items:baseline;gap:7px;flex:1;min-width:0}
  .wall .cargo .slot .dsc{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;
    margin:0;flex:1;min-width:0;font-size:9.5px;line-height:1}
  .wall .cargo .slot .code{font-size:10.5px;line-height:1}
  .wall .cargo .slot .st{display:none}
}

@container slot (max-width:36px){ .wall .cargo .slot .code{font-size:9.5px;line-height:1;letter-spacing:-.2px} }

const STATUSES=["Stocked","Low","Out","Expired","Service due","Not carried"];
const SIDES=["Driver side","Passenger side","Rear doors","Cab"];
// drawn as you see it standing inside the van: facing the driver wall the cab is
// to your right, facing the passenger wall it is to your left
const groupOf = code => String(code).replace(/\d+$/,"");
const bayOf   = code => String(code)[0];
function bayBounds(bay){
  const cs=comps().filter(c=>bayOf(c.code)===bay);
  if(!cs.length)return null;
  const x=Math.min(...cs.map(c=>c.x)), y=Math.min(...cs.map(c=>c.y));
  return {side:cs[0].side, x, y,
    w:Math.max(...cs.map(c=>c.x+c.w))-x, h:Math.max(...cs.map(c=>c.y+c.h))-y, n:cs.length};
}
/* the van, side on, cab to the left; the cargo grid overlays x 48-249 of this box */

function vanKey(bay,showEnds){
  const b=bayBounds(bay); if(!b)return "";
  const W=S.walls[b.side]||{cols:144,rows:60};
  return `<div class="vankey">
    <div class="vanwrap${b.side==="Driver side"?" mirrored":""}">
      <div class="vanbody">${vanSVG()}
        <div class="cargo" style="grid-template-columns:repeat(${W.cols},minmax(0,1fr));
          grid-template-rows:repeat(${W.rows},minmax(0,1fr));gap:0">
          <div class="here" style="grid-column:${b.x+1}/span ${b.w};grid-row:${b.y+1}/span ${b.h}"></div>
        </div></div></div>
    ${showEnds?`<div class="keyends"><span>${b.side==="Driver side"?"Rear":"Front"}</span><span>${b.side==="Driver side"?"Front":"Rear"}</span></div>`:""}
  </div>`;
}

const GUIDEITEMS=[["Magnetic fingerprint powder","C","Reagent",["Use on non-metal surfaces only: paper, wood, tile, glass.","Do not use on metal.","Do not use on a wet surface. Powder and moisture turn to paste — let it dry or use another method.","Pour a small amount onto a plate or an evidence envelope folded like a plate. Never dip the applicator into the container.","Apply with the magnetic applicator only.","Lift onto a white backing card."]],["Black fingerprint powder","C","Reagent",["Use on light-coloured surfaces: light paper, wood, tile, glass, metals.","Lift onto a white backing card. The card is always the opposite colour to the powder.","Apply with the fiberglass brush.","Pour a small amount onto a plate or a folded evidence envelope. Never dip the brush into the container.","Do not use on a wet surface."]],["White fingerprint powder","C","Reagent",["Use on dark-coloured surfaces: dark paper, wood, tile, glass, metals.","Lift onto a black backing card. The card is always the opposite colour to the powder.","Apply with the fiberglass brush.","Pour a small amount onto a plate or a folded evidence envelope. Never dip the brush into the container.","Do not use on a wet surface."]],["Copper fingerprint powder","C","Reagent",["Carried in the kit as an alternative when black and white give poor contrast.","Match the powder to the surface: the powder must contrast with the surface, and the backing card must contrast with the powder.","Pour a small amount onto a plate or a folded evidence envelope. Never dip the brush into the container.","Do not use on a wet surface."]],["Silver black fingerprint powder","C","Reagent",["Do not use. Carried in the kit but not to be used.","Use black powder on light surfaces or white powder on dark surfaces instead."]],["Magnetic applicator","C","Durable",["For magnetic powder only.","Load from powder poured onto a plate or folded envelope, never from the container.","Clean between surfaces."]],["Fiberglass brush","C","Durable",["For applying white and black powder.","Load from powder poured onto a plate or folded envelope, never from the container.","Do not use on a wet surface."]],["Feather duster","C","Durable",["For removing small amounts of excess powder from a print before lifting.","Never dip it into a powder container."]],["Hinge lifters","C","Consumable",["Lift the developed print, then fold the hinge over onto the backing card.","Backing card is the opposite colour to the powder used: white card for black or magnetic powder, black card for white powder.","Label the lift with the location it came from and the surface."]],["Gel lifters","C","Consumable",["For lifting from textured or curved surfaces where tape will not sit flat.","Photograph the lift before packaging.","Label with the location and surface it came from."]],["Lifting tape","C","Consumable",["For flat surfaces. Lay the tape down without trapping air, lift in one movement.","Transfer to a backing card of the opposite colour to the powder.","Label with the location and surface it came from."]],["Backing cards, white","C","Consumable",["Used with black powder and with magnetic powder.","The card is always the opposite colour to the powder so the lift still reads."]],["Backing cards, black","C","Consumable",["Used with white powder.","The card is always the opposite colour to the powder so the lift still reads."]],["Cotton swabs, DNA","D","Consumable",["Collect with one wet swab and one dry swab from the same area.","One sample per envelope. DNA from different areas of the scene never shares an envelope.","Name the exact surface swabbed on the envelope, not just the room.","Elimination DNA is required before the swabs can be tested if there is a known victim."]],["Buccal swab kit","D","Consumable",["For known samples and elimination DNA.","One sample per envelope.","Elimination DNA is required before scene swabs can be tested if there is a known victim."]],["GSR / SEM kit","E","Consumable",["Record a separate time for every sample site.","Sites are taken as right back, right palm, left back, left palm.","Write each site and its time on the envelope, for example: right back 0943 hrs, right palm 0945 hrs.","Note where the kit was collected, including at autopsy."]],["Red evidence envelopes","H","Consumable",["General evidence. Anything that is not drugs and fits in an envelope.","Write the description on the envelope first, then copy it into EFORCE word for word.","The description answers four things: what and how many, which evidence marker, where exactly, and when plus your item number.","Write the EFORCE tag number on the envelope once it is issued."]],["Blue evidence envelopes","H","Consumable",["Suspected drugs only. Nothing else goes in a blue envelope.","Suspected drugs must not go in a red envelope.","Write the EFORCE tag number on the envelope once it is issued."]],["Brown paper bags","H","Consumable",["For items too large for a normal envelope.","Place a red evidence sticker on the bag and label the sticker.","For clothing and lab items, state what the item is packaged in — the lab will not accept a submission without it."]],["Red evidence stickers","H","Consumable",["Applied to brown paper bags and any container that is not a pre-printed envelope.","Label the sticker the same way you would label an envelope."]],["Sharps container","H","Consumable",["Knives and other sharp or pointed objects.","If it could cut somebody handling it later, it goes in a sharps container, not an envelope."]],["Gun box","G","Consumable",["Unload the firearm. It goes into the box unloaded.","If it is a pistol, lock the slide back before boxing.","Zip-tie the firearm to the box so it cannot shift.","Draw an arrow on the printed firearm picture on the outside of the box showing which way the firearm faces inside.","Do not put ammunition in the gun box. Ammunition is packaged separately with its own EFORCE entry.","Check the chamber and the magazine before the box is closed.","EFORCE comment needs: date and time collected, status of the firearm, round count, whether one was chambered, and where it was found."]],["Small plastic baggies, casings","G","Consumable",["Each casing goes into its own small baggie.","All of the baggies then go into one red evidence envelope.","Label the envelope with how many casings are inside and the casing information."]],["Bullet boxes, cotton lined","G","Consumable",["A recovered bullet or fragment goes into a small brown box with cotton lining.","The box then goes into a red evidence envelope."]],["Dry safe","H","Durable",["For wet clothing. Wet items never go into evidence envelopes.","Follow the instructions posted on the dry safe itself."]],["Latex gloves","A","Consumable",["Worn any time you handle evidence. Wear two pairs.","The first pair stays on while you collect. Change the outer pair between items, not just when it looks dirty.","Two pairs keep your own prints and DNA off the evidence.","Patrol gloves are not PPE. They protect neither you nor the evidence."]],["Crime scene tape","A","Consumable",["Set the perimeter larger than you believe the scene is. You can bring it in later; you cannot re-secure ground people have walked through.","If you are not sure where the edge of the scene is, put the tape further out.","Everyone who crosses the tape goes on the scene entry log, including you."]],["Evidence markers","B","Durable",["Set the marker next to the item. Never move evidence to place a marker — if placing it there would move the item, set it further away.","The marker number you use is the number that goes on the envelope and in your photographs.","Some markers have a scale built in; use it for close-up shots."]],["Temporary evidence markers","B","Consumable",["Placed on arrival to keep people off possible evidence until the real markers reach the scene.","Do not move evidence to place one."]],["L-scale","B","Durable",["Used in every close-up photograph.","It gives size in both directions, and the targets let the lab correct for camera angle.","Use the marker's built-in scale or a scale from the evidence collection box."]],["Scene camera","B","Durable",["Check it before you need it: charged, and no files left on the card.","Photograph in four ranges in order: overall, mid, close, then close-up with scale.","Overall: start wide, include street signs or the address so the photos tie to a location.","Mid: buildings and obvious evidence, overlapping every frame so positions relate to each other.","Close: the item filling the frame, still in place.","Close-up with scale: the same shot with a scale beside it.","Get the overall shots early, before more people arrive and add to the scene.","Back at the station, move the photographs off the card and delete them from the camera card."]]];

  const a=cs.filter(s=>s.k==="action").length, t=cs.filter(s=>s.k==="attn").length,
        u=cs.filter(s=>s.k==="unchecked").length;
  return `${a?`<span class="badge b-action">${WARN}${a} need action</span>`:""}
          ${t?`<span class="badge b-attn">${WARN}${t} attention</span>`:""}
          ${u?`<span class="badge b-unchecked">${WARN}${u} not checked</span>`:""}

function groupsFor(side){
  const cs=comps().filter(c=>c.side===side), by={};
  cs.forEach(c=>{ const g=groupOf(c.code);
    (by[g]=by[g]||[]).push(c); });
  return Object.keys(by).map(g=>{
    const m=by[g];
    const x=Math.min(...m.map(c=>c.x)), y=Math.min(...m.map(c=>c.y));
    const w=Math.max(...m.map(c=>c.x+c.w))-x, hh=Math.max(...m.map(c=>c.y+c.h))-y;
    const st=m.map(c=>compState(c.code));
    const k=st.some(s=>s.k==="action")?"action":st.some(s=>s.k==="attn")?"attn"
           :st.every(s=>s.k==="good")?"good":"unchecked";
    return {g,x,y,w,h:hh,n:m.length,k,bay:bayOf(g),
            desc:(m[0].desc||"").replace(/,\s*double width$/,"")};
  }).sort((a,b)=>a.y-b.y||a.x-b.x);
}

function compState(code){
  const it=live().filter(i=>i.loc===code);
  const rec=S.comps.find(c=>c.code===code);
  // sweeping is per cycle: logging stock is not the same as having looked today
  if(!(rec&&rec.checked))return{k:"unchecked",
    label:it.length?"Not checked \u00b7 "+it.length+(it.length===1?" item":" items"):"Not checked",
    parts:[],items:it};
  if(!it.length)return{k:"good",label:"Empty",parts:[],items:it};
  const bad=i=>isOut(i)||isExpired(i);
  const out=it.filter(isOut).length, exp=it.filter(i=>isExpired(i)&&!isOut(i)).length;
  const low=it.filter(i=>isLow(i)&&!bad(i)).length;
  const soon=it.filter(i=>isExpiring(i)&&!bad(i)).length, svc=it.filter(i=>isService(i)&&!bad(i)).length;
  const p=[];
  if(out)p.push(out+" out"); if(exp)p.push(exp+" expired");
  if(low)p.push(low+" low"); if(soon)p.push(soon+" expiring"); if(svc)p.push(svc+" service");
  if(out||exp)return{k:"action",label:p.join(", "),parts:p,items:it};
  if(low||soon||svc)return{k:"attn",label:p.join(", "),parts:p,items:it};
  return{k:"good",label:it.length+(it.length===1?" item":" items"),parts:[],items:it};
}

let dirty=false, pushT=null, conflict=false, syncErr="";

const b64enc=s=>{const b=new TextEncoder().encode(s);let out="";
  for(let i=0;i<b.length;i+=8192)out+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  return btoa(out)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const ghOn=()=>!!(S.gh.owner&&S.gh.repo&&S.gh.token);
const ghURL=()=>`https://api.github.com/repos/${S.gh.owner}/${S.gh.repo}/contents/${S.gh.path||"data.json"}`;
const ghHead=()=>({Authorization:"Bearer "+S.gh.token,Accept:"application/vnd.github+json",
  "X-GitHub-Api-Version":"2022-11-28"});
let storageState={asked:false,persisted:false,used:0,quota:0};
async function claimStorage(){
  try{
    if(navigator.storage&&navigator.storage.persisted){
      storageState.persisted=await navigator.storage.persisted();
      if(!storageState.persisted&&navigator.storage.persist)
        storageState.persisted=await navigator.storage.persist();
    }
    if(navigator.storage&&navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      storageState.used=e.usage||0; storageState.quota=e.quota||0;
    }
  }catch(e){}
  storageState.asked=true;
  if(view==="data")renderData();
}
const payload=()=>({items:S.items,comps:S.comps,forms:S.forms.map(f=>{
    const c=Object.assign({},f);delete c.fills;return c}),walls:S.walls,demo:S.demo,
  lastCat:S.lastCat,lastCls:S.lastCls,savedAt:new Date().toISOString()});

async function ghPull(silent){
  if(!ghOn())return;
  try{
    const r=await fetch(ghURL()+"?ref=HEAD&t="+Date.now(),{headers:ghHead(),cache:"no-store"});
    if(r.status===404){S.gh.sha="";store.set(S);if(!silent)toast("No data file yet — push to create it");return"empty"}
    if(!r.ok)throw new Error(r.status===401?"Token rejected":r.status===403?"No access to that repo":"GitHub error "+r.status);
    const j=await r.json(), o=JSON.parse(b64dec(j.content));
    S.items=o.items||[];S.comps=o.comps||[];S.forms=o.forms||[];if(o.walls)S.walls=o.walls;S.demo=!!o.demo;
    S.gh.sha=j.sha;S.gh.last=new Date().toISOString();dirty=false;conflict=false;
    syncErr="";retries=0;clearTimeout(pushT);store.set(S);renderSyncBar();
    if(!silent)toast("Pulled "+S.items.length+" items");render();return"ok";
  }catch(e){if(!silent)toast(e.message||"Pull failed");return"error"}
}
async function ghPush(force){
  if(!ghOn())return;
  try{
    const body={message:"Van inventory — "+new Date().toISOString().slice(0,16).replace("T"," "),
      content:b64enc(JSON.stringify(payload(),null,1))};
    if(S.gh.sha&&!force)body.sha=S.gh.sha;
    else if(force){const r0=await fetch(ghURL(),{headers:ghHead(),cache:"no-store"});
      if(r0.ok){const j0=await r0.json();body.sha=j0.sha}}
    const r=await fetch(ghURL(),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},ghHead()),
      body:JSON.stringify(body)});
    if(r.status===409||r.status===422){conflict=true;store.set(S);renderData();
      return toast("Someone else changed the data — see Sync")}
    if(!r.ok)throw new Error(r.status===401?"Token rejected":r.status===403?"No write access":"GitHub error "+r.status);
    const j=await r.json();S.gh.sha=j.content.sha;S.gh.last=new Date().toISOString();
    dirty=false;conflict=false;syncErr="";retries=0;store.set(S);
    renderSyncBar();renderData();return"ok";
  }catch(e){
    syncErr=e.message||"Couldn't reach GitHub";
    store.set(S);renderSyncBar();
    clearTimeout(pushT);pushT=setTimeout(()=>ghPush(false),retryIn());
    return "error"}
}
let retries=0;
function retryIn(){retries=Math.min(retries+1,6);return Math.min(60000,2000*Math.pow(2,retries-1))}
function queuePush(){ if(!ghOn())return; dirty=true; retries=0;
  clearTimeout(pushT); pushT=setTimeout(()=>ghPush(false),2500);
  renderSyncPill(); renderSyncBar(); }
function renderSyncBar(){
  const b=$("#syncbar"); if(!b)return;
  const offline=typeof navigator!=="undefined"&&navigator.onLine===false;
  if(!ghOn()||(!dirty&&!syncErr&&!conflict)){b.style.display="none";b.innerHTML="";fitHeader();return}
  let msg,cls;
  if(conflict){cls="bad";msg="Another device changed the data. Open Sync to choose which version wins."}
  else if(offline){cls="warn";msg="No connection. Your changes are saved on this phone and will push when you're back online."}
  else if(syncErr){cls="bad";msg=syncErr+". Retrying — your changes are still saved on this phone."}
  else {b.style.display="none";b.innerHTML="";fitHeader();return}
  b.className="demobar "+cls; b.style.display="";
  b.innerHTML=`<span>${esc(msg)}</span><button id="syncnow">${conflict?"Open Sync":"Retry"}</button>`;
  fitHeader();
}
function renderSyncPill(){
  const el=$("#syncpill"); if(!el)return;
  el.textContent=conflict?"Conflict":dirty?"Saving…":S.gh.last?"Synced "+S.gh.last.slice(11,16):"Not synced";
  el.className="syncpill"+(conflict?" bad":dirty?" busy":"");
}

function autoPlace(side){
  const W=S.walls[side]||{cols:24,rows:12};
  const mine=S.comps.filter(c=>c.side===side);
  const grid=[];for(let r=0;r<W.rows;r++)grid.push(new Array(W.cols).fill(false));
  const mark=(c)=>{for(let r=c.y;r<Math.min(W.rows,c.y+c.h);r++)
    for(let x=c.x;x<Math.min(W.cols,c.x+c.w);x++)grid[r][x]=true};
  const fits=(x,y,w,hh)=>{if(x+w>W.cols||y+hh>W.rows)return false;
    for(let r=y;r<y+hh;r++)for(let q=x;q<x+w;q++)if(grid[r][q])return false;return true};
  mine.filter(c=>c.x!=null&&c.y!=null).forEach(mark);
  mine.filter(c=>c.x==null||c.y==null).forEach(c=>{
    outer:for(let y=0;y<W.rows;y++)for(let x=0;x<W.cols;x++)
      if(fits(x,y,c.w,c.h)){c.x=x;c.y=y;mark(c);break outer}
    if(c.x==null){c.x=0;c.y=0}});
}

function bayZoomApply(k,cx,cy){
  const z=document.getElementById("bayzoom"), p=document.getElementById("bayplan"); if(!z||!p)return;
  const k0=bayZoomK; k=Math.min(4,Math.max(1,k)); if(k===k0)return;
  const r=z.getBoundingClientRect();
  const fx=cx==null?.5:(cx-r.left)/r.width, fy=cy==null?.5:(cy-r.top)/r.height;
  const sx=z.scrollLeft+fx*r.width, sy=z.scrollTop+fy*r.height;
  bayZoomK=k; p.style.setProperty("--k",k);
  z.scrollLeft=sx*k/k0-fx*r.width; z.scrollTop=sy*k/k0-fy*r.height;
  const l=document.getElementById("bayzl"); if(l)l.textContent=Math.round(k*100)+"%";
}
const BAYP=new Map(); let bayPinch=null, bayPan=null;
document.addEventListener("pointerdown",e=>{
  const z=e.target.closest&&e.target.closest("#bayzoom"); if(!z)return;
  if(e.isPrimary){BAYP.clear();bayPinch=null;bayPan=null;bayDragged=false}
  BAYP.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(BAYP.size===2){ const [a,b]=[...BAYP.values()]; bayPinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:bayZoomK}; bayPan=null; e.preventDefault(); return }
  if(e.pointerType==="mouse"){ bayPan={x:e.clientX,y:e.clientY,sl:z.scrollLeft,st:z.scrollTop} }
},true);
document.addEventListener("pointermove",e=>{
  if(!BAYP.has(e.pointerId))return;
  BAYP.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const z=document.getElementById("bayzoom"); if(!z)return;
  if(bayPinch&&BAYP.size>=2){ const [a,b]=[...BAYP.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    bayZoomApply(bayPinch.k*d/Math.max(1,bayPinch.d),(a.x+b.x)/2,(a.y+b.y)/2); e.preventDefault(); return }
  if(bayPan){ const dx=e.clientX-bayPan.x, dy=e.clientY-bayPan.y;
    if(Math.hypot(dx,dy)>6)bayDragged=true;
    z.scrollLeft=bayPan.sl-dx; z.scrollTop=bayPan.st-dy }
},{capture:true,passive:false});
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,e=>{
  if(!BAYP.has(e.pointerId))return; BAYP.delete(e.pointerId);
  if(BAYP.size<2)bayPinch=null; if(!BAYP.size)bayPan=null;
},true));
document.addEventListener("wheel",e=>{
  const z=e.target.closest&&e.target.closest("#bayzoom"); if(!z||!(e.ctrlKey||e.metaKey))return;

function closeSheet(){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on")}

const today=()=>new Date().toISOString().slice(0,10);

function itemStatus(i){
  if(!placed(i))return["unchecked","Not placed yet"];
  if(isOut(i))return["action","Out of stock"];
  if(isExpired(i))return["action","Expired"];
  if(isLow(i))return["attn","Below par"];
  if(isService(i))return["attn","Service due"];
  if(isExpiring(i))return["attn","Expires in "+daysOut(i.date)+" days"];
  return["good","Good"];
}
function miniWall(code){
  const c=S.comps.find(x=>x.code===code);
  if(!c||!SIDES.includes(c.side))return "";
  SIDES.forEach(autoPlace);
  if(c.x==null||c.y==null)return "";
  const W=S.walls[c.side]||{cols:24,rows:12};
  const mine=comps().filter(o=>o.side===c.side&&o.x!=null);
  return `<div class="mini">
    <div class="minihead"><b>${esc(c.code)}</b> &middot; ${esc(c.side)}</div>
    <div class="minigrid" style="grid-template-columns:repeat(${W.cols},minmax(0,1fr));grid-template-rows:repeat(${W.rows},minmax(0,1fr));gap:${W.cols>60?1:2}px">
      ${mine.map(o=>`<div class="mslot${o.code===c.code?" hit":""}"
        style="grid-column:${o.x+1}/span ${o.w};grid-row:${o.y+1}/span ${o.h}"
        ></div>`).join("")}
    </div>
    <div class="miniorient"><span>${capLeft(c.side)}</span><span>${capRight(c.side)}</span></div>
  </div>`;
}

function relSheet(it){
  const draw=(q)=>{
    const ql=(q||"").toLowerCase();
    const list=live().filter(o=>o.id!==it.id)
      .filter(o=>!ql||(o.name+" "+o.loc+" "+catName(o.cat)).toLowerCase().includes(ql))
      .sort((a,b)=>{const s=(it.rel||[]).includes(b.id)-(it.rel||[]).includes(a.id);
        return s||a.name.localeCompare(b.name)}).slice(0,60);
    $("#rellist").innerHTML=list.map(o=>{const on=(it.rel||[]).includes(o.id);
      return `<button class="relrow${on?" on":""}" data-pick="${o.id}">
        <span class="tick">${on?"&#10003;":""}</span>
        <span><span class="rn">${esc(o.name)}</span><span class="rl">${esc(o.loc||"—")} · ${esc(catName(o.cat))}</span></span>
      </button>`}).join("")||`<p class="hint">Nothing matches that.</p>`;

/* ---------- printable van map ---------- */
function renderPrint(){
  $("#title").textContent="Printable map";
  const cs=comps();
  const bays=[...new Set(cs.map(c=>bayOf(c.code)))].sort();

  // one block per unit, drawn to its own scale so the labels fit
  const unit=bay=>{
    const mine=cs.filter(c=>bayOf(c.code)===bay);
    if(!mine.length)return "";
    const minX=Math.min(...mine.map(c=>c.x)), minY=Math.min(...mine.map(c=>c.y));
    const W=Math.max(...mine.map(c=>c.x+c.w))-minX, H=Math.max(...mine.map(c=>c.y+c.h))-minY;
    const side=mine[0].side;
    return `<section class="punit">
      <h3>${esc(BAYNAME[bay]||"Bay "+bay)}
        <span>${esc(side)} · ${W}&Prime; wide · ${mine.length} compartments</span></h3>
      <div class="pgrid" style="grid-template-columns:repeat(${W},minmax(0,1fr));
        grid-template-rows:repeat(${H},minmax(0,1fr));aspect-ratio:${(W/H).toFixed(3)};
        gap:${W>40?1:4}px">
        ${mine.map(c=>`<div class="pslot"
          style="grid-column:${c.x-minX+1}/span ${c.w};grid-row:${c.y-minY+1}/span ${c.h}">
          <b>${esc(c.code)}</b>${c.desc?`<i>${esc(c.desc)}</i>`:""}</div>`).join("")}
      </div>
      <div class="porient"><span>${capLeft(side)}</span><span>${capRight(side)}</span></div>
    </section>`};

  const rows=cs.filter(c=>SIDES.includes(c.side)).map(c=>{
    const it=live().filter(i=>i.loc===c.code)
      .sort((a,b)=>a.name.localeCompare(b.name));
    const list=it.length
      ? it.map(i=>`<span class="pit">${esc(i.qty)}&times; ${esc(i.name)}${
          i.cat?` <em>${esc(catName(i.cat))}</em>`:""}</span>`).join("")
      : `<span class="pit pempty">empty</span>`;
    return `<tr><td class="pc">${esc(c.code)}</td>
      <td>${esc(c.desc||"")}<div class="pits">${list}</div></td>
      <td class="pn">${it.length}</td></tr>`}).join("");

  $("#v-print").innerHTML=`
    <div class="noprint" style="display:flex;gap:8px;margin-bottom:14px;align-items:center">
      <button class="back" data-navback="compartments" style="margin:0;align-self:center">&#8249; Storage</button>
      <button class="btn" id="doprint" style="margin:0;max-width:none">Print</button></div>
    <p class="hint noprint" style="margin:0 0 16px">A page per unit plus a full index, to tape inside
      the van. Use Safari on a computer to print — the home screen
      version has no print menu.</p>
    <div class="psheet">
      <div class="phead"><b>Van compartment map</b><span>${esc(today())}</span></div>
      ${bays.map(unit).join("")}
      <h3 class="plist">Compartment index</h3>
      <table class="ptab"><thead><tr><th>Code</th><th>What it holds</th><th>Items</th></tr></thead>
        <tbody>${rows}</tbody></table>
    </div>`;
}

function measure(sk,px){

function formStale(f){ if(!f.verified)return false;

function renderForms(){
  $("#title").textContent="Scenes";
  const past=closedIncidents();
  if(!past.length){
    $("#v-forms").innerHTML=`<div class="empty"><strong>No finished scenes yet</strong>
      <p>Close an incident when you have finished with it and it moves here, with everything
         that belongs to it.</p>
      <button class="btn" data-scenestab="open">See open scenes</button></div>`;
    return;
  }
  const year=x=>String(x.closed||"").slice(0,4)||"Undated";
  const g={}; past.forEach(i=>{(g[year(i)]=g[year(i)]||[]).push(i)});

  .sort((a,b)=>String(b.closed).localeCompare(String(a.closed)));

// everything attached to one incident, whether exported or not
function docsFor(incId){
  const f=(S.fills||[]).filter(x=>x.incidentId===incId).map(x=>({
    kind:"fill",id:x.id,rec:x,type:x.formName||"Form",exported:!!x.exported}));
  const s=(S.sketches||[]).filter(x=>x.incidentId===incId).map(x=>({
    kind:"sketch",id:x.id,rec:x,type:"Sketch",exported:!!x.exported}));
  return [...f,...s];
}
// what the checklist shows for one planned document
function planState(inc,key){
  const d=DOCPLAN.find(x=>x.key===key); if(!d)return null;
  const mine=docsFor(inc.id).filter(x=>
    d.form? x.type===d.form : x.kind==="sketch");
  if(!mine.length)return {d,state:"none",docs:[]};
  if(mine.every(x=>x.exported||(x.rec&&x.rec.completed)))return {d,state:"done",docs:mine};
  return {d,state:"open",docs:mine};
}
function openDocs(){
  const f=(S.fills||[]).filter(x=>!x.exported&&!x.incidentId).map(x=>({
    kind:"fill", id:x.id, when:x.started||"",
    caseNo:(fillCase(x)||"").trim(), type:x.formName||"Form"}));
  const s=(S.sketches||[]).filter(x=>!x.exported&&!x.incidentId&&(x.objs||[]).length).map(x=>({
    kind:"sketch", id:x.id, when:x.when||"",
    caseNo:(x.caseNo||"").trim(), type:"Sketch"}));
  return [...f,...s].sort((a,b)=>
    (a.caseNo||"~").localeCompare(b.caseNo||"~")||a.type.localeCompare(b.type));
}
function fillCase(r){
  const f=S.forms.find(x=>x.id===r.formId); if(!f)return "";
  const c=(f.fields||[]).find(x=>/case/i.test(x.label));
  return c?String(r.values[c.id]||"") : "";
}

/* ---------- pdf ---------- */
let jsPDFlib=null;
function loadPDF(){
  if(jsPDFlib)return Promise.resolve(jsPDFlib);
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>{jsPDFlib=(window.jspdf||{}).jsPDF;
      jsPDFlib?res(jsPDFlib):rej(new Error("PDF library loaded oddly"))};
    s.onerror=()=>rej(new Error("Couldn't load the PDF tool. Do one export on wifi and it stays cached."));
    document.head.appendChild(s);
  });
}
// one packet: cover, then the documents in a fixed order, numbered straight through
const BUNDLEORDER=["report","entrylog","evidence","sketch","photolog"];
const BUNDLE_PHOTO_INDEX=false;   // the photograph log carries the pictures now
async function bundleIncident(inc){
  let JsPDF; try{ JsPDF=await loadPDF() }catch(e){ return toast(e.message) }
  const items=[], gaps=[];
  BUNDLEORDER.forEach(key=>{
    const st=planState(inc,key); if(!st)return;
    if(!st.docs.length){ gaps.push(st.d.label); return }
    st.docs.forEach(d=>items.push({key,label:st.d.label,...d}));
  });
  docsFor(inc.id).forEach(d=>{
    if(!items.some(x=>x.id===d.id))items.push({key:"extra",label:d.type,...d});
  });
  if(!items.length)return toast("Nothing to bundle yet");

  const doc=new JsPDF({unit:"pt",format:"letter"});
  const contents=[];
  for(const it of items){
    doc.addPage("letter", it.kind==="sketch"&&!it.rec.portrait ? "landscape" : "portrait");
    const from=doc.internal.getNumberOfPages();
    if(it.kind==="fill") await exportFill(it.rec,doc);
    else                 await exportSketch(it.rec,doc);
    contents.push({label:it.label, from, to:doc.internal.getNumberOfPages()});
  }
  // photographs referenced by the sketches, listed after them
  const shots=[];
  for(const it of items){
    if(!BUNDLE_PHOTO_INDEX||it.kind!=="sketch")continue;
    for(const o of (it.rec.objs||[])){
      if(o.t!=="photopoint")continue;
      let img=null;
      if(o.photoId){ try{ img=await photoGet(o.photoId) }catch(e){} }
      shots.push({n:o.n||"", label:o.label||"", img});
    }
  }
  if(BUNDLE_PHOTO_INDEX&&shots.length){
    shots.sort((a,b)=>(parseInt(a.n,10)||0)-(parseInt(b.n,10)||0));
    doc.addPage("letter","portrait");
    const from=doc.internal.getNumberOfPages();
    const PW=doc.internal.pageSize.getWidth(), PH=doc.internal.pageSize.getHeight(), PM=54;
    let py=PM+8;
    doc.setFont("helvetica","bold");doc.setFontSize(15);doc.setTextColor(0);
    doc.text("Photograph index",PM,py); py+=16;
    doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(110);
    doc.text("Reference copies. The photographs in the case file are the evidential copies.",PM,py);
    py+=18; doc.setDrawColor(30);doc.setLineWidth(1);doc.line(PM,py,PW-PM,py); py+=16;
    const cw=(PW-2*PM-16)/2;
    let col=0, rowTop=py;
    for(const s of shots){
      const x=PM+col*(cw+16);
      if(rowTop+cw*0.80>PH-PM-20){ doc.addPage("letter","portrait"); rowTop=PM; col=0 }
      const ix=PM+col*(cw+16);
      let bottom=rowTop;
      if(s.img){
        const ih=Math.min(cw*s.img.hh/s.img.w, cw*0.78);
        try{ doc.addImage(s.img.data,"JPEG",ix,rowTop,cw,ih,undefined,"FAST") }catch(e){}
        doc.setDrawColor(170);doc.setLineWidth(.6);doc.rect(ix,rowTop,cw,ih);
        bottom=rowTop+ih;
      }else{
        doc.setDrawColor(190);doc.setLineWidth(.6);doc.rect(ix,rowTop,cw,cw*0.55);
        doc.setFontSize(8.5);doc.setTextColor(150);
        doc.text("No reference copy attached",ix+cw/2,rowTop+cw*0.30,{align:"center"});
        bottom=rowTop+cw*0.55;
      }
      doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(0);
      doc.text("Photograph "+(s.n||"\u2014"),ix,bottom+14);
      doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(60);
      doc.text(doc.splitTextToSize(s.label||"No caption",cw).slice(0,2),ix,bottom+27);
      if(col===1){ rowTop=bottom+48; col=0 } else col=1;
    }
    contents.push({label:"Photograph index",from,to:doc.internal.getNumberOfPages()});
  }
  const total=doc.internal.getNumberOfPages();
  const ref="B-"+(inc.caseNo||"NOCASE").replace(/[^A-Za-z0-9]+/g,"")+"-"
    +new Date().toISOString().slice(0,10).replace(/-/g,"")+"-"
    +String(Date.now()).slice(-4);

  // cover
  doc.setPage(1);
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=64;
  let y=M+10;
  try{ doc.addImage(BADGE,"PNG",M,y,58,50,undefined,"FAST") }catch(e){}
  doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(20);
  ["WILLIAMSPORT BUREAU OF POLICE","FORENSIC SERVICES UNIT"].forEach((t,i)=>
    doc.text(t,M+72,y+20+i*13));
  y+=76;
  doc.setDrawColor(20);doc.setLineWidth(1.4);doc.line(M,y,W-M,y); y+=34;
  doc.setFontSize(22);doc.text("Scene documentation",M,y); y+=30;
  doc.setFontSize(28);doc.text(inc.caseNo||"No case number",M,y); y+=34;
  doc.setFont("helvetica","normal");doc.setFontSize(11.5);doc.setTextColor(40);
  [["Offence or incident",inc.offence],["Scene",inc.addr],
   ["Incident opened",(inc.opened||"").slice(0,16).replace("T"," ")],
   ["Bundle reference",ref],
   ["Generated",new Date().toISOString().slice(0,16).replace("T"," ")],
   ["Total pages",String(total)]].forEach(([k,v])=>{
    doc.setFont("helvetica","bold");doc.setFontSize(7);doc.setTextColor(110);
    doc.text(String(k).toUpperCase(),M,y);
    doc.setFont("helvetica","normal");doc.setFontSize(11.5);doc.setTextColor(0);
    doc.text(String(v||"\u2014"),M+130,y); y+=21;
  });
  y+=14;
  doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("Contents",M,y);y+=6;
  doc.setLineWidth(.8);doc.setDrawColor(60);doc.line(M,y,W-M,y);y+=18;
  doc.setFont("helvetica","normal");doc.setFontSize(11);
  contents.forEach(c=>{
    doc.text(c.label,M,y);
    doc.text(c.from===c.to?("page "+c.from):("pages "+c.from+"\u2013"+c.to),W-M,y,{align:"right"});
    y+=18;
  });
  if(gaps.length){
    y+=12;
    doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(150,40,40);
    doc.text("Not included",M,y);y+=16;
    doc.setFont("helvetica","normal");doc.setFontSize(10.5);
    gaps.forEach(g=>{doc.text(g+" \u2014 not prepared",M,y);y+=15});
    doc.setTextColor(0);
  }
  doc.setFontSize(8.5);doc.setTextColor(120);
  doc.text("This bundle is a copy assembled from the unit's records. The case file remains the record.",
    M,H-M,{maxWidth:W-2*M});

  // running header and continuous numbering on every page
  for(let i=1;i<=total;i++){
    doc.setPage(i);
    const pw=doc.internal.pageSize.getWidth(), ph=doc.internal.pageSize.getHeight();
    doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(140);
    if(i>1)doc.text((inc.caseNo||"No case number")+"  \u00b7  "+ref, 40, 26);
    doc.text("Page "+i+" of "+total, pw-40, ph-20, {align:"right"});
    doc.setTextColor(0);
  }

  const name=(inc.caseNo||"incident").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-bundle.pdf";
  const blob=doc.output("blob");
  try{
    const file=new File([blob],name,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:(inc.caseNo||"Incident")+" bundle"});
      return toast("Bundle sent");

function photoRowsPDF(doc,rows,cols,thumbs,ctx){

  rows.forEach(row=>{
    need(TH+18); let y=ctx.getY(); const top=y;
    const n=String(row[cols[0]]||"").trim(), img=thumbs[n];
    if(img){
      const ih=Math.min(TH,TW*img.hh/img.w), iw=Math.min(TW,TH*img.w/img.hh);
      try{ doc.addImage(img.data,"JPEG",M,top,iw,ih,undefined,"FAST") }catch(e){}

    }else{
      doc.setDrawColor(190);doc.setLineWidth(.6);doc.rect(M,top,TW,TH);
      doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(150);
      doc.text("No copy attached",M+TW/2,top+TH/2+3,{align:"center"});
    }
    const tx=M+TW+GAP, tw=W-M-tx;
    doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(0);
    const meta=[n?"Photograph "+n:"Photograph",row["Facing"]?"facing "+row["Facing"]:"",row["Time"]?row["Time"]:""].filter(Boolean).join("  \u00b7  ");
    doc.text(meta,tx,top+11);
    doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(30);
    const lines=doc.splitTextToSize(String(row["What it shows"]||"\u2014"),tw);
    doc.text(lines,tx,top+25);
    const extra=cols.filter(c=>!["Facing","Time","What it shows"].includes(c)&&c!==cols[0]&&String(row[c]||"").trim())
      .map(c=>c+": "+row[c]).join("  \u00b7  ");
    let bottom=top+25+lines.length*11;
    if(extra){doc.setFontSize(8.5);doc.setTextColor(110);doc.text(doc.splitTextToSize(extra,tw),tx,bottom+2);bottom+=11}
    y=Math.max(top+TH,bottom)+GAP;
    doc.setDrawColor(225);doc.setLineWidth(.5);doc.line(M,y-6,W-M,y-6);
    ctx.setY(y);
  });
  ctx.setY(ctx.getY()+4);
}

      doc.text(String(x.label),M,y);y+=12;

      };

      (rows.length?rows:[{}]).forEach(row=>{
        const cells=cols.map((c,i)=>doc.splitTextToSize(String(row[c]||""),wArr[i]-PADX*2));

    blocks.forEach((lines,bi)=>{

  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
  afterExport(r);
}

function parseAddr(q){
  const m=String(q).trim().match(/^(\d+)\s+(.*)$/);

  const name=(m?m[2]:String(q)).toUpperCase()

    .replace(/\b(NORTH|SOUTH|EAST|WEST|N|S|E|W|NE|NW|SE|SW)\b\.?/g," ")

  const where=(num!=null?`Add_Number=${num} AND `:"")+`St_Name LIKE '${esc2(name)}%'`;

    +"&outFields=Add_Number,St_PreDir,St_Name,St_PosTyp,Inc_Muni,Post_Code"
    +"&returnGeometry=true&outSR=4326&resultRecordCount=12&f=json";
  const r=await fetch(url);

  const j=await r.json();

  const url=PEMA_IMG+"?bbox="+bbox+"&bboxSR=3857&imageSR=3857&size="+px+","+px
    +"&format=jpg&transparent=false&f=image";
  const r=await fetch(url);

    sk.orthoSrc=bq.dataset.osrc; saveLocal(); orthoSheet(sk,bq.dataset.osrc)});
  const f=$("#opf");
  // metres of ground per image pixel, whichever way the number is expressed
  const perPx=v=>faro ? (v>0?1/v:0) : (v>0?v/100:0);
  const preview=()=>{
    const file=f&&f.files&&f.files[0];
    const v=parseFloat(($("#opm")||{}).value||"");
    const el=$("#opinfo"); if(!el)return;
    if(!(v>0)){el.textContent=faro?"Enter the Pixel/Meter value you used in SCENE."

    img.onerror=()=>{el.textContent="That file could not be read as an image. A .tif will not open \u2014 export a JPG.";
      URL.revokeObjectURL(u)};

    const file=f&&f.files&&f.files[0];
    if(!file)return toast("Choose the exported image first");

    if(!(v>0))return toast(faro?"Enter the Pixel/Meter value first":"Enter the GSD first");
    if(file.size>10*1024*1024)return toast("That image is over 10 MB \u2014 export it smaller");
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const availH=pageH(sk)-(hasHeader(sk)?HEADER_H:0);
        let w=pageW(sk), hh=w*img.height/img.width;
        if(hh>availH){hh=availH;w=hh*img.width/img.height}

          sk.bg={imgId,x:(pageW(sk)-w)/2,y:(hasHeader(sk)?HEADER_H:0)+(availH-hh)/2,
                 w,h:hh,op:1,place:"",px:img.width,

                           : ("Pix4D orthomosaic at "+v+" cm/px GSD, average")};
          if(faro)sk.bgPPM=String(v); else sk.bgGSD=String(v);
          sk.orthoSrc=src;

          sk.scale={px:w,real:Math.round(feet*100)/100,unit:"ft"};

        });
      };

}
function bgSheet(sk){

      toast("Aerial placed, "+feet+" ft across at "+px+" px \u2014 to scale");

      $("#bghits").innerHTML=`<p class="hint" style="margin:0 0 10px;color:var(--red)">${esc(err.message)}</p>`;

function keepScroll(fn){
  const y=window.scrollY||0;
  const rail=document.querySelector(".skrail"), r=rail?rail.scrollTop:0;
  fn();
  // the panel re-renders after us, so put it back more than once
  const put=()=>{ window.scrollTo(0,y);
    const rl=document.querySelector(".skrail"); if(rl)rl.scrollTop=r };
  put();
  if(typeof requestAnimationFrame==="function")requestAnimationFrame(()=>{put();requestAnimationFrame(put)});
  setTimeout(put,60); setTimeout(put,160);
}

function palPreview(t){
