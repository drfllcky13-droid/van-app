<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Van</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Van">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F7F7FA;
  --ink:#000000;--ink2:#6C6C70;--ink3:#8E8E93;
  --line:#D8D8DC;--line2:#E8E8ED;
  --blue:#0A62C4;--bluebg:#E8F0FB;
  --red:#D62B20;--redbg:#FDECEA;--redsolid:#D93A2E;
  --amber:#A96400;--amberbg:#FDF2E0;--ambersolid:#E8890B;
  --green:#1E8A45;--greenbg:#E7F5EC;--greensolid:#22A153;
  --grey:#8E8E93;--greybg:#EFEFF2;
  --dark:#22262B;--darkink:#FFFFFF;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --top:calc(100px + env(safe-area-inset-top));
  --bot:calc(56px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;
  --ink:#FFFFFF;--ink2:#AEAEB2;--ink3:#8E8E93;
  --line:#38383A;--line2:#2C2C2E;
  --blue:#57A6FF;--bluebg:#132A44;
  --red:#FF6B5E;--redbg:#3A1B18;--redsolid:#C7382C;
  --amber:#F0A93B;--amberbg:#3A2A10;--ambersolid:#B87209;
  --green:#4CD07D;--greenbg:#13301F;--greensolid:#1C8746;
  --grey:#8E8E93;--greybg:#2C2C2E;
  --dark:#3A3F45;--darkink:#FFFFFF;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sys);
  font-size:17px;line-height:1.4;padding-top:var(--top);padding-bottom:var(--bot);
  overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}

.hdr{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--card);
  border-bottom:.5px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 12px}
.titlerow{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
.hdr h1{font-size:28px;font-weight:700;letter-spacing:-.022em;margin:0;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gear{background:none;border:0;color:var(--blue);padding:4px;flex:0 0 auto}
#gear svg{width:23px;height:23px;display:block}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card2);
  border:.5px solid var(--line2);border-radius:10px;padding:9px 12px}
.sbox input{border:0;background:none;outline:none;flex:1;padding:0;font-size:16px}
.sbox input::placeholder{color:var(--ink3)}
.sbox svg{width:17px;height:17px;color:var(--ink3);flex:0 0 auto}
.sbox button{background:none;border:0;color:var(--blue);font-size:15px;padding:0 2px}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);
  border-top:.5px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;padding:7px 1px 8px;color:var(--ink3);
  font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button[aria-current=true]{color:var(--blue)}
.g{width:22px;height:22px;display:block}

.side{display:none}
.view{display:none;padding:14px 16px 30px}
.view.on{display:block}

@media (min-width:820px){
  body{padding:0;display:grid;grid-template-columns:100px minmax(0,1fr);min-height:100vh}
  .tabs{display:none}
  .hdr{position:sticky;padding:calc(14px + env(safe-area-inset-top)) 28px 14px;grid-column:2}
  .titlerow{margin:6px 0 12px}
  .hdr h1{font-size:30px}
  .side{display:flex;flex-direction:column;gap:2px;background:var(--card);
    border-right:.5px solid var(--line);padding:calc(20px + env(safe-area-inset-top)) 0 20px;
    position:sticky;top:0;height:100vh}
  .side button{background:none;border:0;color:var(--ink3);padding:12px 4px;
    font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px}
  .side button[aria-current=true]{color:var(--blue)}
  .side .g{width:24px;height:24px}
  .view{padding:6px 28px 60px;grid-column:2}
  .demobar{grid-column:2}
}

/* ---------- priority strip ---------- */
.strip{display:flex;flex-direction:column;gap:10px}
@media (min-width:820px){.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
.pcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;
  border-radius:14px;padding:15px 16px;color:#fff}
.pcard:active{opacity:.9}
.pcard .n{display:block;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.18}
.pcard .s{display:block;font-size:13.5px;opacity:.92;margin-top:3px;line-height:1.3}
.pcard .ch{margin-left:auto;font-size:20px;opacity:.85}
.pcard svg{width:22px;height:22px;flex:0 0 auto}
.p-red{background:var(--redsolid)}
.p-amber{background:var(--ambersolid)}
.p-dark{background:var(--dark);color:var(--darkink)}
.p-green{background:var(--greensolid)}
@media (min-width:820px){
  .pcard{flex-direction:column;align-items:flex-start;gap:6px;padding:18px;min-height:118px}
  .pcard .n{font-size:34px}
  .pcard .ch{display:none}
  .pcard svg{width:24px;height:24px;margin-bottom:2px}
}

.sect{font-size:13px;font-weight:600;color:var(--ink2);margin:24px 2px 9px}
.qf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qf button{background:var(--card);border:.5px solid var(--line2);border-radius:12px;
  padding:12px 11px;text-align:left;min-height:84px;display:flex;flex-direction:column}
.qf .nm{font-size:14px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.qf .lc{font-size:13px;color:var(--blue);font-weight:600;margin-top:auto;padding-top:8px}

/* ---------- rows ---------- */
.rows{background:var(--card);border-radius:12px;border:.5px solid var(--line2);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;
  border:0;border-bottom:.5px solid var(--line2);padding:13px 14px}
.row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.row .code{font-size:16.5px;font-weight:600;letter-spacing:-.01em;display:block}
.row .desc{font-size:13.5px;color:var(--ink2);margin-top:1px;display:block}
.row .rt{margin-left:auto;display:flex;align-items:center;gap:9px;flex:0 0 auto}
.badge{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-action{background:var(--redbg);color:var(--red)}
.b-attn{background:var(--amberbg);color:var(--amber)}
.b-good{background:var(--greenbg);color:var(--green)}
.b-unchecked{background:var(--greybg);color:var(--grey)}
.chev{color:var(--ink3);font-size:16px}

/* ---------- van walls ---------- */
.wall{background:var(--card);border:.5px solid var(--line2);border-radius:16px;
  padding:14px;margin-bottom:14px}
.whead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.whead b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.whead span{font-size:12.5px;color:var(--ink3)}
.vanwrap{position:relative;height:212px;margin-bottom:4px}
.vanbody{position:absolute;left:0;right:0;top:0;height:184px;background:var(--ink3);
  clip-path:polygon(0% 92%,0% 60%,4% 34%,20% 30%,30% 0%,100% 0%,100% 92%)}
.vaninner{position:absolute;inset:0;background:var(--card2);
  clip-path:polygon(1% 90%,1% 61%,5% 35.5%,20.6% 31.5%,30.7% 1.6%,99% 1.6%,99% 90%)}
.wheel{position:absolute;border-radius:50%;background:var(--card2);
  border:2.5px solid var(--ink3);width:42px;height:42px;top:150px}
.wheel.f{left:14%}.wheel.r{left:72%}
.cargo{position:absolute;left:40%;right:2.5%;top:9%;bottom:15%;display:grid;gap:3px}
.slot{border-radius:6px;padding:4px 5px;text-align:left;border:.5px solid transparent;
  overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.slot .code{font-size:11.5px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.15}
.slot .dsc{font-size:10px;opacity:.8;display:block;line-height:1.2;margin-top:1px}
.slot .st{font-size:10px;font-weight:600;display:block;line-height:1.2}
.s-action{background:var(--redbg);color:var(--red);border-color:var(--red)}
.s-attn{background:var(--amberbg);color:var(--amber);border-color:var(--amber)}
.s-good{background:var(--greenbg);color:var(--green);border-color:var(--green)}
.s-unchecked{background:var(--greybg);color:var(--grey);border-color:var(--line)}
.slot.sel{outline:2.5px solid var(--blue);outline-offset:1px}
.orient{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin:0 2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:4px 2px 16px;font-size:12.5px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:block}
.demobar{background:var(--amberbg);color:var(--amber);padding:11px 16px;font-size:13px;
  display:flex;align-items:center;gap:12px;line-height:1.35}
.demobar span{flex:1;min-width:0}
.demobar button{margin-left:auto;background:var(--amber);color:var(--card);border:0;
  border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;flex:0 0 auto}
.cdhead{background:var(--card);border:.5px solid var(--line2);border-radius:14px;padding:16px;margin-bottom:14px}
.cdhead h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.cdhead .sub{font-size:14.5px;color:var(--ink2);margin-top:2px}
.cdstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.back{background:none;border:0;color:var(--blue);font-size:16px;padding:0;margin-bottom:12px;font-weight:500}
.acts{display:flex;gap:8px;margin-bottom:16px}
.acts button{flex:1;padding:12px 8px;border-radius:11px;border:.5px solid var(--line);
  background:var(--card);color:var(--blue);font-size:14.5px;font-weight:600}
.ph{background:var(--bluebg);color:var(--blue);border-radius:10px;padding:11px 13px;
  font-size:13px;line-height:1.5;margin-bottom:12px}
.editbar{display:flex;gap:8px;margin-bottom:12px}
.editbar button{flex:1;padding:10px;border-radius:10px;border:.5px solid var(--line);
  background:var(--card);color:var(--blue);font-size:14.5px;font-weight:600}
.editbar button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.epanel{background:var(--card);border:.5px solid var(--line2);border-radius:12px;
  padding:14px;margin-bottom:14px}
.epanel h4{margin:0 0 10px;font-size:15px;font-weight:700}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.four label{display:block}
.four span{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.four input{width:100%;padding:9px 6px;text-align:center;background:var(--card2);
  border:.5px solid var(--line);border-radius:8px;color:var(--ink)}
@media (min-width:820px){
  .walls{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .vanwrap{height:300px}
  .vanbody{height:262px}
  .wheel{width:58px;height:58px;top:214px}
  .slot .code{font-size:13px}
  .slot .dsc,.slot .st{font-size:11px}
}

.empty{border:1px dashed var(--line);border-radius:12px;padding:30px 20px;text-align:center;color:var(--ink2)}
.empty strong{display:block;font-size:17px;color:var(--ink);margin-bottom:6px;font-weight:600}
.empty p{margin:0 auto;max-width:36ch;font-size:14.5px;line-height:1.5}
.btn{display:block;width:100%;max-width:320px;margin:16px auto 0;padding:13px;border:0;
  border-radius:11px;background:var(--blue);color:#fff;font-size:16px;font-weight:600}
.btn:active{opacity:.85}
.btn.sec{background:var(--card);color:var(--blue);border:.5px solid var(--line)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
input[type=text],input[type=date],select,textarea{width:100%;padding:11px 12px;background:var(--card);
  border:.5px solid var(--line);border-radius:10px;appearance:none;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:.5px solid var(--line2);border-radius:12px;padding:14px;max-width:600px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{font-size:15px;font-weight:600;background:var(--card);border:.5px solid var(--line);
  border-radius:9px;padding:9px 12px;color:var(--ink)}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);
  border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;
  padding:14px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .2s ease-out}
.sheet.on{transform:translateY(0)}
@media (min-width:820px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;
  border-radius:14px;transform:translate(-50%,-50%) scale(.97);opacity:0}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h3{margin:2px 0 14px;font-size:19px;font-weight:700;letter-spacing:-.01em}
.grab{width:36px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 12px}
@media (min-width:820px){.grab{display:none}}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;
  background:var(--bluebg);color:var(--blue);padding:4px 9px;border-radius:6px;text-transform:uppercase}
.idtitle{font-size:26px;font-weight:700;letter-spacing:-.025em;margin:10px 0 0;line-height:1.15}
.idsub{font-size:15px;color:var(--ink2);margin-top:2px}
.star{background:none;border:0;font-size:24px;color:var(--ink3);padding:0 4px;line-height:1}
.star.on{color:#E8A317}
.idsect{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:22px 2px 9px}
.loc{display:grid;grid-template-columns:1fr auto;background:var(--card);
  border:.5px solid var(--line2);border-radius:12px;overflow:hidden}
.loc .lft{padding:13px 14px}
.loc .cd{font-size:18px;font-weight:700;letter-spacing:-.01em}
.loc .ds{font-size:13.5px;color:var(--ink2);margin-top:1px}
.loc .rgt{padding:13px 16px;border-left:.5px solid var(--line2);text-align:center;
  background:var(--card2);display:flex;flex-direction:column;justify-content:center;min-width:88px}
.loc .qn{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.loc .ql{font-size:11.5px;color:var(--ink2)}
.mini{background:var(--card);border:.5px solid var(--line2);border-radius:12px;
  padding:11px 12px 9px;margin-top:9px}
.minihead{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px}
.minigrid{display:grid;gap:2px;height:88px;border:1px solid var(--line);
  border-radius:6px;padding:3px;background:var(--card2)}
.mslot{border:1px solid var(--line);border-radius:3px;background:transparent;opacity:.5}
.mslot.hit{background:var(--blue);border-color:var(--blue);opacity:1;
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:11px;font-weight:700;letter-spacing:-.01em;overflow:hidden}
.miniorient{display:flex;justify-content:space-between;font-size:10.5px;
  color:var(--ink3);margin-top:5px}
@media (min-width:820px){.minigrid{height:120px}.mslot.hit{font-size:13px}}
.parrow{display:flex;gap:16px;padding:10px 3px 0;font-size:14px;color:var(--ink2)}
.parrow b{color:var(--ink);font-weight:600}
.steps{background:var(--card);border:.5px solid var(--line2);border-radius:12px;padding:6px 4px}
.step{display:flex;gap:11px;padding:9px 11px;align-items:flex-start}
.step i{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--bluebg);
  color:var(--blue);font-style:normal;font-size:12px;font-weight:700;display:flex;
  align-items:center;justify-content:center;margin-top:1px}
.step p{margin:0;font-size:14.5px;line-height:1.45}
.kv{background:var(--card);border:.5px solid var(--line2);border-radius:12px;overflow:hidden}
.kv div{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;
  border-bottom:.5px solid var(--line2);font-size:14.5px}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--ink2);flex:0 0 auto}
.kv dd{margin:0;text-align:right;font-weight:500}
.actbar{position:sticky;bottom:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  margin-top:22px;background:var(--card);border:.5px solid var(--line2);border-radius:14px;padding:6px}
.actbar button{padding:12px 4px;border:0;border-radius:10px;background:none;color:var(--blue);
  font-size:14px;font-weight:600}
.actbar button:active{background:var(--card2)}
.actbar button.primary{background:var(--blue);color:#fff}
.rel{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.reltile{background:var(--card);border:.5px solid var(--line2);border-radius:11px;
  padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:78px}
.reltile .rn{font-size:14px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.reltile .rl{font-size:12.5px;color:var(--blue);font-weight:600}
.reltile .rq{font-size:11.5px;font-weight:600;margin-top:auto;padding:2px 7px;
  border-radius:20px;align-self:flex-start}
.rellist{max-height:44vh;overflow-y:auto;border:.5px solid var(--line2);border-radius:11px;background:var(--card)}
.relrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;
  border:0;border-bottom:.5px solid var(--line2);padding:11px 13px}
.relrow:last-child{border-bottom:0}
.relrow .tick{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:0 0 auto}
.relrow.on .tick{background:var(--blue);border-color:var(--blue)}
.relrow .rn{display:block;font-size:15px;font-weight:500;line-height:1.25}
.relrow .rl{display:block;font-size:12.5px;color:var(--ink2)}
.okbox{background:var(--greenbg);color:var(--green);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45}
.fmt{background:var(--card2);border:.5px solid var(--line2);border-radius:9px;padding:10px 11px;
  font-family:var(--mono);font-size:11.5px;line-height:1.5;overflow-x:auto;margin:0 0 12px;white-space:pre}
.unver{background:var(--amberbg);color:var(--amber);border-radius:10px;padding:10px 12px;
  font-size:13px;line-height:1.45;margin-top:9px}
.psheet{background:#fff;color:#000;border:.5px solid var(--line);border-radius:10px;padding:18px}
.phead{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1.5px solid #000;padding-bottom:7px;margin-bottom:14px}
.phead b{font-size:17px;font-weight:700}
.phead span{font-size:12px;color:#555}
.pwall{margin-bottom:16px;break-inside:avoid}
.pwall h3{margin:0 0 3px;font-size:14px;font-weight:700}
.porient{display:flex;justify-content:space-between;font-size:10px;color:#666;margin-bottom:4px}
.pgrid{display:grid;gap:3px;height:150px;border:1.5px solid #000;padding:4px;border-radius:4px}
.pslot{border:1px solid #000;border-radius:3px;padding:3px 4px;overflow:hidden;background:#fff}
.pslot b{display:block;font-size:11px;font-weight:700;line-height:1.15}
.pslot i{display:block;font-size:9px;font-style:normal;color:#444;line-height:1.15;margin-top:1px}
.plist{font-size:14px;font-weight:700;margin:16px 0 6px}

const daysOut=d=>{if(!d)return null;const t=Date.parse(d);if(isNaN(t))return null;
  return Math.round((t-Date.now())/86400000)};
const isLow=i=>i.par!==""&&i.par!=null&&n(i.qty)<n(i.par);
const isOut=i=>i.status==="Out"||n(i.qty)===0;
const isExpired=i=>{const d=daysOut(i.date);return i.status==="Expired"||(i.cls!=="Durable"&&d!==null&&d<0)};
const isExpiring=i=>{const d=daysOut(i.date);return i.cls!=="Durable"&&d!==null&&d>=0&&d<=90};
const isService=i=>{const d=daysOut(i.date);return i.status==="Service due"||(i.cls==="Durable"&&d!==null&&d<=30)};
const gaps=()=>S.items.filter(i=>i.status==="Not carried"&&i.gapType!=="deliberate");

function compState(code){
  const it=live().filter(i=>i.loc===code);
  const rec=S.comps.find(c=>c.code===code);
  if(!it.length)return rec&&rec.checked?{k:"good",label:"Empty",items:it}
    :{k:"unchecked",label:"Not checked",items:it};
  const bad=i=>isOut(i)||isExpired(i);
  const out=it.filter(isOut).length, exp=it.filter(i=>isExpired(i)&&!isOut(i)).length;
  const low=it.filter(i=>isLow(i)&&!bad(i)).length;
  const soon=it.filter(i=>isExpiring(i)&&!bad(i)).length, svc=it.filter(i=>isService(i)&&!bad(i)).length;
  const p=[];
  if(out)p.push(out+" out"); if(exp)p.push(exp+" expired");
  if(low)p.push(low+" low"); if(soon)p.push(soon+" expiring"); if(svc)p.push(svc+" service");
  if(out||exp)return{k:"action",label:p.join(", "),items:it};
  if(low||soon||svc)return{k:"attn",label:p.join(", "),items:it};
  return{k:"good",label:it.length+(it.length===1?" item":" items"),items:it};
}

/* ---------- github sync ---------- */
if(!S.gh)S.gh={owner:"",repo:"",path:"data.json",token:"",sha:"",last:""};
let dirty=false, pushT=null, conflict=false;

const b64enc=s=>{const b=new TextEncoder().encode(s);let out="";
  for(let i=0;i<b.length;i+=8192)out+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  return btoa(out)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const ghOn=()=>!!(S.gh.owner&&S.gh.repo&&S.gh.token);
const ghURL=()=>`https://api.github.com/repos/${S.gh.owner}/${S.gh.repo}/contents/${S.gh.path||"data.json"}`;
const ghHead=()=>({Authorization:"Bearer "+S.gh.token,Accept:"application/vnd.github+json",
  "X-GitHub-Api-Version":"2022-11-28"});
const payload=()=>({items:S.items,comps:S.comps,walls:S.walls,demo:S.demo,
  lastCat:S.lastCat,lastCls:S.lastCls,savedAt:new Date().toISOString()});

async function ghPull(silent){
  if(!ghOn())return;
  try{
    const r=await fetch(ghURL()+"?ref=HEAD&t="+Date.now(),{headers:ghHead(),cache:"no-store"});
    if(r.status===404){S.gh.sha="";store.set(S);if(!silent)toast("No data file yet — push to create it");return"empty"}
    if(!r.ok)throw new Error(r.status===401?"Token rejected":r.status===403?"No access to that repo":"GitHub error "+r.status);
    const j=await r.json(), o=JSON.parse(b64dec(j.content));
    S.items=o.items||[];S.comps=o.comps||[];if(o.walls)S.walls=o.walls;S.demo=!!o.demo;
    S.gh.sha=j.sha;S.gh.last=new Date().toISOString();dirty=false;conflict=false;
    clearTimeout(pushT);store.set(S);
    if(!silent)toast("Pulled "+S.items.length+" items");render();return"ok";
  }catch(e){if(!silent)toast(e.message||"Pull failed");return"error"}
}
async function ghPush(force){
  if(!ghOn())return;
  try{
    const body={message:"Van inventory — "+new Date().toISOString().slice(0,16).replace("T"," "),
      content:b64enc(JSON.stringify(payload(),null,1))};
    if(S.gh.sha&&!force)body.sha=S.gh.sha;
    else if(force){const r0=await fetch(ghURL(),{headers:ghHead(),cache:"no-store"});
      if(r0.ok){const j0=await r0.json();body.sha=j0.sha}}
    const r=await fetch(ghURL(),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},ghHead()),
      body:JSON.stringify(body)});
    if(r.status===409||r.status===422){conflict=true;store.set(S);renderData();
      return toast("Someone else changed the data — see Sync")}
    if(!r.ok)throw new Error(r.status===401?"Token rejected":r.status===403?"No write access":"GitHub error "+r.status);
    const j=await r.json();S.gh.sha=j.content.sha;S.gh.last=new Date().toISOString();
    dirty=false;conflict=false;store.set(S);renderData();return"ok";
  }catch(e){toast(e.message||"Push failed")}
}
function queuePush(){ if(!ghOn())return; dirty=true;
  clearTimeout(pushT); pushT=setTimeout(()=>ghPush(false),2500); renderSyncPill(); }
function renderSyncPill(){
  const el=$("#syncpill"); if(!el)return;
  el.textContent=conflict?"Conflict":dirty?"Saving…":S.gh.last?"Synced "+S.gh.last.slice(11,16):"Not synced";
  el.className="syncpill"+(conflict?" bad":dirty?" busy":"");
}

  $("#qclear").style.display=query?"":"none";

      <button class="btn" data-go="sweep">Start a sweep</button>

  }
  const bad=L.filter(i=>isOut(i)||isLow(i));
  const soon=L.filter(i=>(isExpiring(i)||isExpired(i)||isService(i)));
  const gp=gaps();
  const cards=[];
  if(bad.length)cards.push(["red","alert",bad.length+(bad.length===1?" item low or out":" items low or out"),"Tap to review","low"]);
  if(soon.length)cards.push(["amber","clock",soon.length+(soon.length===1?" item expiring":" items expiring"),"Within 90 days","expiring"]);
  if(gp.length)cards.push(["dark","gap",gp.length+(gp.length===1?" gap to decide":" gaps to decide"),"Not in the van","gaps"]);
  if(!cards.length)cards.push(["green","ok","Van is ready",L.length+" items, nothing outstanding","all"]);

  const glyph={alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3L1.8 20h20.4z"/><path d="M12 9v5M12 17.2v.1"/></svg>',
   clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.3l3.4 2"/></svg>',
   gap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/></svg>',
   ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.7 2.7L16 9.5"/></svg>'};

  const strip=cards.map(([c,g,t,s,key])=>`<button class="pcard p-${c}" data-list="${key}">
    ${glyph[g]}<span><span class="n">${esc(t)}</span><span class="s">${esc(s)}</span></span>
    <span class="ch">&#8250;</span></button>`).join("");

  const pop=L.slice().sort((a,b)=>((b.fav?1e6:0)+(b.uses||[]).length)-((a.fav?1e6:0)+(a.uses||[]).length)).slice(0,3);
  const qf=pop.length?`<div class="sect">Quick find</div><div class="qf">`
    +pop.map(i=>`<button data-item="${i.id}"><span class="nm">${esc(i.name)}</span>
      <span class="lc">${esc(i.loc||"—")}</span></button>`).join("")+`</div>`
    +`<p class="empty" style="border:0;padding:10px 2px 0;text-align:left;font-size:13px">Ordered by how often you log use. It'll sharpen as you use it.</p>`:"";
  $("#v-home").innerHTML=`<div class="strip">${strip}</div>${qf}`;
}

function autoPlace(side){
  const W=S.walls[side]||{cols:24,rows:12};
  const mine=S.comps.filter(c=>c.side===side);
  const grid=[];for(let r=0;r<W.rows;r++)grid.push(new Array(W.cols).fill(false));
  const mark=(c)=>{for(let r=c.y;r<Math.min(W.rows,c.y+c.h);r++)
    for(let x=c.x;x<Math.min(W.cols,c.x+c.w);x++)grid[r][x]=true};
  const fits=(x,y,w,hh)=>{if(x+w>W.cols||y+hh>W.rows)return false;
    for(let r=y;r<y+hh;r++)for(let q=x;q<x+w;q++)if(grid[r][q])return false;return true};
  mine.filter(c=>c.x!=null&&c.y!=null).forEach(mark);
  mine.filter(c=>c.x==null||c.y==null).forEach(c=>{
    outer:for(let y=0;y<W.rows;y++)for(let x=0;x<W.cols;x++)
      if(fits(x,y,c.w,c.h)){c.x=x;c.y=y;mark(c);break outer}
    if(c.x==null){c.x=0;c.y=0}});
}

/* ---------- bulk instructions ---------- */
const STALE_MONTHS=12;
function verifyAge(i){ if(!i.verified)return null;
  const t=Date.parse(i.verified); if(isNaN(t))return null;
  return (Date.now()-t)/86400000/30.44 }
const isStale=i=>{const m=verifyAge(i);return m!==null&&m>STALE_MONTHS};

function parseGuides(text){
  const byName={}; live().forEach(i=>{byName[i.name.trim().toLowerCase()]=i});
  const blocks=[]; let cur=null, afterBlank=true;
  const isStep=l=>/^\s*(?:[-*\u2022]|\d+[.)])\s+/.test(l);
  const strip=l=>l.replace(/^\s*(?:[-*\u2022]|\d+[.)])\s+/,"").trim();
  text.split(/\r?\n/).forEach(raw=>{
    const l=raw.trim();
    if(!l){afterBlank=true;return}
    const attr=/^(source|verified)\s*:/i.exec(l);
    if(attr&&cur){cur[attr[1].toLowerCase()]=l.slice(l.indexOf(":")+1).trim();afterBlank=false;return}
    if(afterBlank&&!isStep(l)){
      const hit=byName[l.toLowerCase().replace(/:$/,"")];
      cur={item:hit||null,name:l,steps:[],source:"",verified:""};
      blocks.push(cur);afterBlank=false;return;
    }
    if(cur)cur.steps.push(isStep(l)?strip(l):l);
    afterBlank=false;
  });
  return blocks;
}
function applyGuides(text){
  const blocks=parseGuides(text);
  const good=blocks.filter(b=>b.item&&b.steps.length);
  const miss=blocks.filter(b=>!b.item&&b.steps.length).map(b=>b.name);
  good.forEach(b=>{b.item.steps=b.steps;
    if(b.source)b.item.source=b.source;
    if(b.verified&&/^\d{4}-\d{2}-\d{2}$/.test(b.verified))b.item.verified=b.verified});
  if(good.length)save();
  return {n:good.length,miss:[...new Set(miss)]};
}

/* ---------- data and backup ---------- */
const COLS=["name","loc","cat","cls","qty","par","date","status","gapType","note","source","verified"];
const HEAD=["Item","Compartment","Category","Class","Qty","Par","Date","Status","Gap type","Note","Source","Verified"];
const cell=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=()=>[HEAD.concat("Instructions").join(",")].concat(
  S.items.map(i=>COLS.map(c=>cell(i[c])).concat(cell((i.steps||[]).join(" | "))).join(","))).join("\n");
function parseCSV(t){const rows=[];let row=[],f="",q=false;
  for(let x=0;x<t.length;x++){const c=t[x];
    if(q){if(c==='"'){if(t[x+1]==='"'){f+='"';x++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[x+1]==="\n")x++;row.push(f);f="";
      if(row.some(v=>v!==""))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(v=>v!==""))rows.push(row);return rows}
function download(text,name,type){
  try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
    S.lastBackup=today();save();return true}catch(e){return false}}
function ingest(text,replace){
  text=(text||"").trim(); if(!text)return toast("Nothing pasted");
  if(text[0]==="{"){let o;try{o=JSON.parse(text)}catch(e){return toast("That backup didn't parse")}
    if(!o.items)return toast("No items in that file");
    if(replace){S.items=o.items;S.comps=o.comps||[];if(o.walls)S.walls=o.walls;S.demo=!!o.demo}
    else o.items.forEach(x=>{x.id=newId();S.items.push(x)});
    save();renderData();return toast(o.items.length+" items "+(replace?"restored":"added"))}
  const rows=parseCSV(text); if(rows.length<2)return toast("Nothing to import");
  const add=[];
  rows.slice(1).forEach(r=>{if(!r[0]||!r[0].trim())return;
    const o={id:newId(),uses:[],fav:false};
    COLS.forEach((c,j)=>o[c]=(r[j]??"").trim());
    o.qty=n(o.qty); o.steps=(r[COLS.length]||"").split(" | ").map(s=>s.trim()).filter(Boolean);
    if(!STATUSES.includes(o.status))o.status="Stocked";
    if(!CATS.some(c=>c[0]===o.cat))o.cat="A";
    if(!CLASSES.includes(o.cls))o.cls="Consumable";
    add.push(o)});
  if(replace)S.items=add; else S.items=S.items.concat(add);
  add.forEach(o=>{if(o.loc&&!S.comps.some(c=>c.code===o.loc))
    S.comps.push({code:o.loc,desc:"",side:"",x:null,y:null,w:6,h:4})});
  save();renderData();toast(add.length+" rows "+(replace?"loaded":"added"));
}

      return `<button class="row" data-item="${i.id}">
        <span><span class="code">${esc(i.name)}</span>
        <span class="desc">${esc(i.loc||"—")} · ${esc(i.qty)} in stock${i.par?" · par "+esc(i.par):""}</span></span>
        <span class="rt"><span class="badge b-${s[0]}">${esc(s[1])}</span><span class="chev">&#8250;</span></span></button>`
      }).join("")+`</div>`
    :`<div class="empty"><strong>Nothing here</strong><p>That list is clear.</p></div>`);
}

/* ---------- search ---------- */
function renderSearch(){
  $("#title").textContent="Search";
  const q=query.toLowerCase();
  const hits=live().filter(i=>(i.name+" "+i.loc+" "+i.cat+" "+catName(i.cat)+" "+i.cls).toLowerCase().includes(q)).slice(0,40);
  $("#v-search").innerHTML=hits.length
    ? `<div class="sect">${hits.length} result${hits.length===1?"":"s"}</div><div class="rows">`
      +hits.map(i=>{const cp=S.comps.find(c=>c.code===i.loc);
        return `<button class="row" data-item="${i.id}">
          <span><span class="code">${esc(i.name)}</span>
          <span class="desc">${esc(i.loc||"—")}${cp&&cp.desc?" · "+esc(cp.desc):""} · ${esc(i.qty)} in stock</span></span>
          <span class="rt"><span class="chev">&#8250;</span></span></button>`}).join("")+`</div>`
    : `<div class="empty"><strong>Nothing found</strong><p>No item, compartment, or category matches that.</p></div>`;
}

/* ---------- sweep ---------- */
function renderSweep(){
  $("#title").textContent="Sweep";
  const cur=S.curLoc, cs=comps(), here=live().filter(i=>i.loc===cur);
  $("#v-sweep").innerHTML=`
    <div class="chips">${cs.map(c=>`<button data-loc="${esc(c.code)}" class="${c.code===cur?"on":""}">${esc(c.code)}</button>`).join("")}</div>
    <div class="card" style="margin-bottom:14px">
      <div class="two"><label class="fld"><span>New compartment</span>
        <input type="text" id="nc" placeholder="BIN-7" autocapitalize="characters"></label>
        <label class="fld"><span>Where it is</span><input type="text" id="nd" placeholder="Drawer 3, left"></label></div>
      <div class="two"><label class="fld"><span>Side of the van</span><select id="nz">
        <option value="">Not placed yet</option>${SIDES.map(z=>`<option>${z}</option>`).join("")}</select></label>
        <label class="fld"><span>Size on the wall</span>
          <div style="display:flex;gap:6px"><input type="text" id="nw" inputmode="numeric" placeholder="W 6" style="text-align:center">
          <input type="text" id="nh" inputmode="numeric" placeholder="H 4" style="text-align:center"></div></label></div>
      <button class="btn sec" id="addc" style="margin:0;max-width:none">Add compartment</button></div>
    ${cur?`<div class="card">
      <label class="fld"><span>Item</span><input type="text" id="f-name" placeholder="Black magnetic powder, 1 lb"></label>
      <div class="two"><label class="fld"><span>Quantity</span><input type="text" id="f-qty" inputmode="numeric" value="1"></label>
        <label class="fld"><span>Par level</span><input type="text" id="f-par" inputmode="numeric" placeholder="Blank for now"></label></div>
      <div class="two"><label class="fld"><span>Category</span><select id="f-cat">${CATS.map(c=>`<option value="${c[0]}"${c[0]===S.lastCat?" selected":""}>${c[0]} · ${c[1]}</option>`).join("")}</select></label>
        <label class="fld"><span>Class</span><select id="f-cls">${CLASSES.map(c=>`<option${c===S.lastCls?" selected":""}>${c}</option>`).join("")}</select></label></div>
      <label class="fld"><span>Expiry or service date</span><input type="date" id="f-date"></label>
      <button class="btn" id="add" style="margin:4px 0 0;max-width:none">Add to ${esc(cur)}</button></div>
      ${here.length?`<div class="sect">In ${esc(cur)} — ${here.length}</div><div class="rows">`
        +here.slice().reverse().map(i=>`<button class="row" data-item="${i.id}">
          <span><span class="code">${esc(i.name)}</span><span class="desc">${esc(i.qty)} in stock${i.par?" · par "+esc(i.par):""}</span></span>
          <span class="rt"><span class="chev">&#8250;</span></span></button>`).join("")+`</div>`:""}`
    :`<div class="empty"><strong>Pick a compartment</strong><p>Choose one above, or add a new code and say where it sits in the van.</p></div>`}`;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g)return go(g.dataset.go);
  const l=e.target.closest("[data-list]"); if(l){view="home";return renderList(l.dataset.list)}
  const ed=e.target.closest("[data-edit]");
  if(ed){editing=ed.dataset.edit==="on";if(!editing)editSel=null;return renderComps()}
  if(e.target.closest("#eclose")){editSel=null;return renderComps()}
  if(e.target.closest("#esave")){
    const c=S.comps.find(x=>x.code===editSel); if(!c)return;
    const W=S.walls[c.side]||{cols:24,rows:12};
    c.w=Math.max(1,Math.min(W.cols,n($("#ew").value)||c.w));
    c.h=Math.max(1,Math.min(W.rows,n($("#eh").value)||c.h));
    c.x=Math.max(0,Math.min(W.cols-c.w,n($("#ex").value)));
    c.y=Math.max(0,Math.min(W.rows-c.h,n($("#ey").value)));
    save();renderComps();return toast(c.code+" resized")}
  const c=e.target.closest("[data-comp]");
  if(c){ if(editing){editSel=c.dataset.comp;return renderComps()}
    curComp=c.dataset.comp;view="compdetail";
    $$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-compdetail"));
    window.scrollTo&&window.scrollTo(0,0);return render()}
  const ah=e.target.closest("[data-addhere]");
  if(ah){S.curLoc=ah.dataset.addhere;save();return go("sweep")}
  const ck=e.target.closest("[data-check]");
  if(ck){const cc=S.comps.find(x=>x.code===ck.dataset.check);
    if(cc){cc.checked=new Date().toISOString().slice(0,10);save();renderCompDetail();toast(cc.code+" marked swept")}
    return}
  if(e.target.closest("#doprint")){window.print&&window.print();return}
  if(e.target.closest("#bulkopen"))return bulkSheet();
  if(e.target.closest("#addgap"))return gapSheet(null);
  const ig=e.target.closest("[data-invg]");
  if(ig){invGroup=ig.dataset.invg;return renderInventory()}
  if(e.target.closest("#gear")){view="data";
    $$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-data"));
    $("#q").value="";query="";$("#qclear").style.display="none";
    window.scrollTo&&window.scrollTo(0,0);return render()}
  if(e.target.closest("#dlj")){
    const safe=Object.assign({},S);delete safe.gh;
    return toast(download(JSON.stringify(safe,null,1),"van-backup-"+today()+".json","application/json")
      ?"Backup downloaded":"Download blocked — use Copy CSV")}
  if(e.target.closest("#dlc")){
    return toast(download(toCSV(),"van-inventory-"+today()+".csv","text/csv")
      ?"CSV downloaded":"Download blocked — use Copy CSV")}
  if(e.target.closest("#cpc")){
    navigator.clipboard&&navigator.clipboard.writeText(toCSV())
      .then(()=>{S.lastBackup=today();save();renderData();toast("Copied")})
      .catch(()=>toast("Copy blocked by the browser"));return}
  if(e.target.closest("#ghconnect")){
    S.gh={owner:$("#gho").value.trim(),repo:$("#ghr").value.trim(),
      path:$("#ghp").value.trim()||"data.json",token:$("#ght").value.trim(),sha:"",last:""};
    if(!ghOn()){S.gh.token="";return toast("Owner, repository and token are all needed")}
    store.set(S);toast("Checking...");
    ghPull(true).then(r=>{
      if(r==="error"){S.gh.token="";store.set(S);renderData();return toast("Couldn't reach that repo — check the token")}
      renderData();toast(r==="empty"?"Connected. Push to create the file.":"Connected and pulled")});
    return}
  if(e.target.closest("#ghpush")){toast("Pushing...");ghPush(conflict);return}
  if(e.target.closest("#ghpull")){toast("Pulling...");ghPull(false);return}
  if(e.target.closest("#ghoff")){
    if(!confirm("Disconnect this device? The data stays in the repo and on this device."))return;
    S.gh={owner:"",repo:"",path:"data.json",token:"",sha:"",last:""};store.set(S);
    renderData();return toast("Disconnected")}
  if(e.target.closest("#impadd"))return ingest($("#imp").value,false);
  if(e.target.closest("#imprep")){
    if(confirm("Replace everything currently in the app?"))ingest($("#imp").value,true);return}
  if(e.target.closest("#cleardemo2")){
    if(!confirm("Remove all sample data? Anything you added yourself stays."))return;
    clearDemo();renderData();return toast("Sample cleared")}
  if(e.target.closest("#wipe")){
    if(!confirm("Erase every item and compartment? Download a backup first if you need one."))return;
    S.items=[];S.comps=[];S.curLoc="";S.demo=false;save();return go("home")}
  if(e.target.closest("#loaddemo")){loadDemo();return go("home")}
  if(e.target.closest("#cleardemo")){
    if(!confirm("Remove all sample data? Anything you added yourself stays."))return;
    clearDemo();return go("home")}
  const di=e.target.closest("[data-item]");
  if(di){const it=S.items.find(x=>x.id===di.dataset.item);
    if(it&&it.status==="Not carried")return gapSheet(it);
    return openItem(di.dataset.item)}
  if(e.target.closest("[data-loc]")){S.curLoc=e.target.closest("[data-loc]").dataset.loc;save();return renderSweep()}
  if(e.target.closest("#addc")){
    const code=$("#nc").value.trim().toUpperCase(); if(!code)return toast("Needs a code");
    if(!S.comps.some(x=>x.code===code))
      S.comps.push({code,desc:$("#nd").value.trim(),side:$("#nz").value,
        x:null,y:null,w:n($("#nw").value)||6,h:n($("#nh").value)||4});
    S.curLoc=code;save();renderSweep();return toast("Added "+code)}
  if(e.target.closest("#add")){
    const nm=$("#f-name").value.trim(); if(!nm)return toast("Item needs a name");
    S.lastCat=$("#f-cat").value;S.lastCls=$("#f-cls").value;
    S.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:nm,loc:S.curLoc,
      cat:S.lastCat,cls:S.lastCls,qty:n($("#f-qty").value),par:$("#f-par").value.trim(),
      date:$("#f-date").value||"",status:"Stocked",gapType:"",note:"",steps:[],source:"",verified:"",uses:[]});
    save();renderSweep();toast("Added to "+S.curLoc);const f=$("#f-name");f&&f.focus()}
});

function placeholder(el,t,b){$(el).innerHTML=`<div class="empty"><strong>${t}</strong><p>${b}</p></div>`}
function fitHeader(){
  const hd=document.querySelector(".hdr"); if(!hd)return;
  if(window.matchMedia("(min-width:820px)").matches){document.body.style.paddingTop="";return}
  document.body.style.paddingTop=hd.offsetHeight+"px";
}
window.addEventListener("resize",fitHeader);
window.addEventListener("orientationchange",()=>setTimeout(fitHeader,200));

function render(){
  buildTabs();renderDemoBar();
  if(view==="search")return renderSearch();
  if(view==="itemdetail")return renderItemDetail();
  if(view==="compdetail")return renderCompDetail();
  if(view==="data"){renderData();return fitHeader()}
  if(view==="print")return renderPrint();
  if(view==="home")return renderHome();
  if(view==="compartments")return renderComps();
  if(view==="sweep")return renderSweep();
  $("#title").textContent=(TABS.find(t=>t[0]===view)||[,""])[1];
  if(view==="inventory")return renderInventory();
  if(view==="guide")return renderGuide();
}
render();fitHeader();
if(typeof requestAnimationFrame==='function')requestAnimationFrame(fitHeader);
if(ghOn())ghPull(true).then(()=>renderSyncPill());
</script>
</body>
</html>
