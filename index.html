<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Van</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Van">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F7F7FA;
  --ink:#000000;--ink2:#6C6C70;--ink3:#8E8E93;
  --line:#D8D8DC;--line2:#E8E8ED;
  --blue:#0A62C4;--bluebg:#E8F0FB;
  --red:#D62B20;--redbg:#FDECEA;--redsolid:#D93A2E;
  --amber:#A96400;--amberbg:#FDF2E0;--ambersolid:#E8890B;
  --green:#1E8A45;--greenbg:#E7F5EC;--greensolid:#22A153;
  --grey:#8E8E93;--greybg:#EFEFF2;
  --dark:#22262B;--darkink:#FFFFFF;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --cw:1760px;
  --top:calc(100px + env(safe-area-inset-top));
  --bot:calc(56px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;
  --ink:#FFFFFF;--ink2:#AEAEB2;--ink3:#8E8E93;
  --line:#38383A;--line2:#2C2C2E;
  --blue:#57A6FF;--bluebg:#132A44;
  --red:#FF6B5E;--redbg:#3A1B18;--redsolid:#C7382C;
  --amber:#F0A93B;--amberbg:#3A2A10;--ambersolid:#B87209;
  --green:#4CD07D;--greenbg:#13301F;--greensolid:#1C8746;
  --grey:#8E8E93;--greybg:#2C2C2E;
  --dark:#3A3F45;--darkink:#FFFFFF;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sys);
  font-size:17px;line-height:1.4;padding-top:var(--top);padding-bottom:var(--bot);
  overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}

.hdr{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--card);
  border-bottom:.5px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 12px}
.titlerow{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
.hdr h1{font-size:28px;font-weight:700;letter-spacing:-.022em;margin:0;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gear{background:none;border:0;color:var(--blue);padding:4px;flex:0 0 auto}
#gear svg{width:23px;height:23px;display:block}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card2);
  border:.5px solid var(--line2);border-radius:10px;padding:9px 12px}
.sbox input{border:0;background:none;outline:none;flex:1;padding:0;font-size:16px}
.sbox input::placeholder{color:var(--ink3)}
.sbox svg{width:17px;height:17px;color:var(--ink3);flex:0 0 auto}
.sbox button{background:none;border:0;color:var(--blue);font-size:15px;padding:0 2px}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);
  border-top:.5px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;padding:7px 1px 8px;color:var(--ink3);
  font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button[aria-current=true]{color:var(--blue)}
.g{width:22px;height:22px;display:block}

.side{display:none}
.view{display:none;padding:14px 16px 30px}
.view.on{display:block}


body.wide{padding:0;display:grid;grid-template-columns:232px minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);min-height:100vh}
body.wide .side{grid-column:1;grid-row:1 / -1}
body.wide .hdr{grid-column:2;grid-row:1;
  padding-left:calc(max(0px,(100% - var(--cw))/2) + 28px);
  padding-right:calc(max(0px,(100% - var(--cw))/2) + 28px)}
body.wide .main{grid-column:2;grid-row:2;align-self:start;
  max-width:var(--cw);margin:0 auto;width:100%}
body.wide .tabs{display:none}
body.wide .hdr{position:sticky;grid-column:2;
  padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:14px}
body.wide .titlerow{margin:6px 0 12px}
body.wide .hdr h1{font-size:30px}
body.wide .side{display:flex;flex-direction:column;gap:2px;background:var(--card);
    border-right:.5px solid var(--line);padding:calc(20px + env(safe-area-inset-top)) 0 20px;
    position:sticky;top:0;height:100vh}
body.wide .side button{background:none;border:0;color:var(--ink3);padding:12px 4px;
    font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px}
body.wide .side button[aria-current=true]{color:var(--blue)}
body.wide .side .g{width:24px;height:24px}
body.wide .main{grid-column:2;min-width:0;padding-bottom:40px}
body.wide .view{padding:6px 28px 60px}
body.wide .demobar{border-radius:10px;
  margin-left:calc(max(0px,(100% - var(--cw))/2) + 28px);
  margin-right:calc(max(0px,(100% - var(--cw))/2) + 28px)}


/* ---------- priority strip ---------- */
.strip{display:flex;flex-direction:column;gap:10px}

body.wide .strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;
  border-radius:14px;padding:15px 16px;color:#fff}
.pcard:active{opacity:.9}
.pcard .n{display:block;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.18}
.pcard .s{display:block;font-size:13.5px;opacity:.92;margin-top:3px;line-height:1.3}
.pcard .ch{margin-left:auto;font-size:20px;opacity:.85}
.pcard svg{width:22px;height:22px;flex:0 0 auto}
.p-red{background:var(--redsolid)}
.p-amber{background:var(--ambersolid)}
.p-dark{background:var(--dark);color:var(--darkink)}
.p-green{background:var(--greensolid)}

body.wide .pcard{flex-direction:column;align-items:flex-start;gap:6px;padding:18px;min-height:118px}
body.wide .pcard .n{font-size:34px}
body.wide .pcard .ch{display:none}
body.wide .pcard svg{width:24px;height:24px;margin-bottom:2px}


.skmain{min-width:0}
body.skfull{overflow:hidden}
body.skfull .skgrid.full{position:fixed;inset:0;z-index:80;background:var(--bg);
  padding:10px;gap:10px;display:grid;grid-template-rows:minmax(0,1fr) auto;
  grid-template-columns:minmax(0,1fr);overflow:hidden;
  align-items:stretch;align-content:stretch}
.skgrid.full .skmain{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.skgrid.full .canvaswrap{margin:0 auto;padding:0;overflow:hidden;flex:0 0 auto}
.skgrid.full .skcanvas{width:100%;height:100%;display:block}
.skgrid.full .skrail{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.skgrid.full .editbar{margin:0;flex:0 0 auto}
.skgrid.full .inkrow{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
.inkrow .inklab{font-size:12.5px;color:var(--ink2);margin-right:2px}
.ink{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0;flex:0 0 auto}
.ink.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--bluebg)}
.objset{flex:0 0 auto;max-height:32vh;overflow-y:auto}
.skgrid.full .cdhead,.skgrid.full .back{display:none}
@media (max-width:899px){ .skgrid.full .skrail{max-height:38vh} }
body.skfull .skgrid.full.notools{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.skgrid.full.notools .skrail,.skgrid.full.notools .objset{display:none}
@media (min-width:900px){
  body.skfull .skgrid.full{grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:minmax(0,1fr)}
  .skgrid.full .skrail{max-height:100%}
}
.editbar button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.canvaswrap{background:var(--card);border:.5px solid var(--line);border-radius:12px;
  padding:6px;margin-bottom:10px;touch-action:none}
.skcanvas{width:100%;height:auto;display:block;border-radius:8px;touch-action:none;
  -webkit-user-select:none;user-select:none}
.k-line{fill:none;stroke:var(--kc,#111);stroke-width:2.5}
.k-thin{fill:none;stroke:var(--kc,#111);stroke-width:1.2}
.k-thick{fill:none;stroke:var(--kc,#111);stroke-width:4;stroke-linecap:round}
.k-stroke{fill:none;stroke:var(--kc,#111);stroke-width:2}
.k-dash{fill:none;stroke:var(--kc,#111);stroke-width:2;stroke-dasharray:8 6}
.k-solid{fill:var(--kc,#111);stroke:none}
.k-fill{fill:var(--kc,#111);stroke:none}
.k-text{fill:var(--kc,#111);font-family:var(--sys);font-weight:600}
.k-tag{fill:var(--kc,#111);font-family:var(--sys);font-size:15px;text-anchor:middle}
.hcase{fill:#111;font-family:var(--sys);font-size:27px;font-weight:700;letter-spacing:-.5px}
.haddr{fill:#111;font-family:var(--sys);font-size:16px}
.hmeta{fill:#444;font-family:var(--sys);font-size:14px}
.k-num{fill:#fff;font-family:var(--sys);font-size:22px;font-weight:700;text-anchor:middle}
.k-sel{fill:none;stroke:#0A62C4;stroke-width:2.5;stroke-dasharray:7 5}
.k-handle{fill:#0A62C4;stroke:#fff;stroke-width:2.5}
.k-rot{fill:#0A62C4;stroke:#fff;stroke-width:2.5;cursor:grab}
.k-rotstem{stroke:#0A62C4;stroke-width:2;stroke-dasharray:3 3}
.skhead{pointer-events:none}
.k-legt{fill:var(--kc,#111);font-family:var(--sys);font-weight:700}
.k-legn{fill:var(--kc,#111);font-family:var(--sys);font-weight:700}
.k-legr{fill:var(--kc,#111);font-family:var(--sys)}
.k-legu{fill:#8a8a8a;font-family:var(--sys);font-style:italic}
.layers{background:var(--card);border:.5px solid var(--line2);border-radius:11px;overflow:hidden}
.lay{display:flex;align-items:center;border-bottom:.5px solid var(--line2)}
.lay:last-child{border-bottom:0}
.lay.on{background:var(--bluebg)}
.laypick{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:none;border:0;
  padding:7px 4px 7px 9px;text-align:left}
.lay .lp{width:40px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.lay .lp .pvs{width:38px;height:24px}
.lay .ln2{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layb{background:none;border:0;color:var(--ink3);font-size:12px;padding:8px 5px;flex:0 0 auto}
.layb.del{color:var(--red);font-size:17px;padding-right:9px}
.layb[disabled]{opacity:.25}
@media (hover:hover) and (pointer:fine){.layb:hover:not([disabled]){color:var(--blue)}
  .laypick:hover{background:var(--card2)}}
.objset{background:var(--card);border:.5px solid var(--line2);border-radius:12px;padding:12px 13px}
.oshead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.oshead b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.oshead .osr{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.oshead .osr span{font-family:var(--mono);color:var(--ink)}
.osgrid{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:end}
.osgrid .osname{grid-column:1/-1}
.osgrid .osnum+.osname{grid-column:2}
.osgrid .fld{margin:0}
.objbar{margin-top:10px;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.objbar button{flex:0 0 auto;background:var(--card);border:.5px solid var(--line);
  border-radius:9px;padding:10px 13px;font-size:14px;font-weight:600;color:var(--blue);white-space:nowrap}
.objbar button.danger{color:var(--red);border-color:var(--red)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-bottom:6px}
.palette button{background:var(--card);border:.5px solid var(--line2);border-radius:11px;
  padding:9px 5px 7px;display:flex;flex-direction:column;align-items:center;gap:5px}
.palette .pv{height:32px;display:flex;align-items:center;justify-content:center}
.pvs{width:46px;height:32px;display:block;overflow:visible}
.palette .pn{font-size:11.5px;color:var(--ink2);text-align:center;line-height:1.2}
@media (prefers-color-scheme:dark){.pvs .k-line,.pvs .k-stroke,.pvs .k-thin,.pvs .k-thick,.pvs .k-dash{stroke:#ddd}
 .pvs .k-solid,.pvs .k-fill{fill:#ddd}.pvs .k-text{fill:#ddd}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--greybg);
  border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{background:none;border:0;padding:8px 6px;border-radius:7px;
  font-size:14.5px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.plotwrap{background:var(--card);border:.5px solid var(--line2);border-radius:14px;
  padding:10px;margin-bottom:6px;overflow-x:auto}
.plot{width:100%;height:auto;display:block}
.plot .gl{stroke:var(--line2);stroke-width:1}
.plot .pf{fill:none;stroke:var(--line);stroke-width:1}
.plot .rp{fill:var(--ink2)}
.plot .rt{fill:var(--ink2);font-size:10px;font-family:var(--sys)}
.plot .ip{fill:var(--blue)}
.plot .in{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle;font-family:var(--sys)}
.plot .na{stroke:var(--ink2);stroke-width:1.5}
.plot .naf{fill:var(--ink2)}
.sweepcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:.5px solid var(--line2);border-radius:14px;padding:14px 16px;margin-top:10px}
.sweepcard .n{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.sweepcard .s{display:block;font-size:13.5px;color:var(--ink2);margin-top:2px}
.sweepcard .ch{margin-left:auto;color:var(--ink3);font-size:18px}
.sweepcard.live{border-color:var(--amber);background:var(--amberbg)}
.sweepcard.live .n{color:var(--amber)}
.sweepcard.live .s{color:var(--amber);opacity:.9}
.sect{font-size:13px;font-weight:600;color:var(--ink2);margin:24px 2px 9px}
.subsect{font-size:12.5px;font-weight:600;color:var(--ink3);margin:16px 2px 7px}
.qf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qf button{background:var(--card);border:.5px solid var(--line2);border-radius:12px;
  padding:12px 11px;text-align:left;min-height:84px;display:flex;flex-direction:column}
.qf .nm{font-size:14px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.qf .lc{font-size:13px;color:var(--blue);font-weight:600;margin-top:auto;padding-top:8px}

/* ---------- rows ---------- */
.rows{background:var(--card);border-radius:12px;border:.5px solid var(--line2);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;
  border:0;border-bottom:.5px solid var(--line2);padding:13px 14px}
.row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.row .code{font-size:16.5px;font-weight:600;letter-spacing:-.01em;display:block}
.row .desc{font-size:13.5px;color:var(--ink2);margin-top:1px;display:block}
.row .rt{margin-left:auto;display:flex;align-items:center;gap:9px;flex:0 0 auto}
.badge .bico{width:14px;height:14px;flex:0 0 auto;margin-right:5px;vertical-align:-2px}
.badge.b-unchecked .bico{color:var(--amber)}
.cdtags .badge{display:inline-flex;align-items:center;font-size:13px;padding:6px 13px;
  border-radius:20px;font-weight:600}
.badge{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-action{background:var(--redbg);color:var(--red)}
.b-attn{background:var(--amberbg);color:var(--amber)}
.b-good{background:var(--greenbg);color:var(--green)}
.b-unchecked{background:var(--greybg);color:var(--grey)}
.b-req{background:var(--bluebg);color:var(--blue)}
.links{background:var(--card);border:.5px solid var(--line2);border-radius:12px;overflow:hidden}
.lnk{display:block;padding:12px 14px;border-bottom:.5px solid var(--line2);
  text-decoration:none;color:inherit}
.lnk:last-child{border-bottom:0}
.lnk .ln{display:block;font-size:15px;font-weight:500;color:var(--blue);line-height:1.3}
.lnk .lu{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.chev{color:var(--ink3);font-size:16px}

/* ---------- van walls ---------- */
.wall{margin-bottom:14px;container-type:inline-size;container-name:wall}
.slot.small{padding:2px 4px;gap:0}
.slot.small .code{font-size:11px;line-height:1.1}
.slot.small .st{font-size:9.5px;line-height:1.1}
.slot.tiny{padding:0 1px;gap:0;border-radius:2px;align-items:center;justify-content:center}
.slot.small{border-radius:4px}
.slot.tiny .code{font-size:9.5px;line-height:1}
.wallhead{display:flex;align-items:center;gap:10px}
.wallhead b{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.wallhead .cnt{font-size:12.5px;color:var(--ink3);font-weight:400}
.wallhead .wtags{margin-left:auto;display:flex;gap:5px}
.wallhead .badge{padding:2px 8px}
.vanwrap.mirrored .vanbody{transform:scaleX(-1)}
.vanwrap.mirrored .cargo{transform:scaleX(-1)}
.vanwrap{position:relative;aspect-ratio:2.55/1;max-height:420px;margin-bottom:4px}
@media (max-width:820px){ .vanwrap{aspect-ratio:1.62/1;max-height:none} }
.vanbody{position:absolute;left:0;right:0;top:0;height:87%;z-index:1;background:var(--ink3);
  clip-path:polygon(0% 92%,0% 64%,2% 42%,9% 38%,17% 0%,100% 0%,100% 92%)}
.vaninner{position:absolute;inset:0;background:var(--card2);
  clip-path:polygon(1% 90%,1% 65%,3% 43.5%,9.6% 39.5%,17.9% 1.6%,99% 1.6%,99% 90%)}
.wheel{position:absolute;border-radius:50%;background:var(--card2);
  border:2.5px solid var(--ink3);height:19%;aspect-ratio:1;width:auto;top:71%}
.wheel.f{left:8%}.wheel.r{left:76%}
.cargo{position:absolute;left:19%;right:2.5%;top:7%;bottom:13%;display:grid;gap:3px;overflow:hidden}
.slot{border-radius:6px;padding:4px 5px;text-align:left;border:.5px solid transparent;
  overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0;gap:1px;
  container-type:size;container-name:slot}
.slot>span{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.slot .code{font-size:11.5px;font-weight:700;letter-spacing:-.01em;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.slot .dsc{font-size:10px;opacity:.85;line-height:1.2;margin-top:1px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;min-height:0}
.slot .dsc.two{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;text-overflow:clip}
.slot .st{font-size:10px;font-weight:600;line-height:1.2;margin-top:auto;flex:0 0 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-action{background:var(--redbg);color:var(--red);border-color:var(--red)}
.s-attn{background:var(--amberbg);color:var(--amber);border-color:var(--amber)}
.s-good{background:var(--greenbg);color:var(--green);border-color:var(--green)}
.s-unchecked{background:var(--greybg);color:var(--grey);border-color:var(--line)}
.slot.sel{outline:2.5px solid var(--blue);outline-offset:1px}
.orient{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin:0 2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:4px 2px 16px;font-size:12.5px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:block}
.demobar{background:var(--amberbg);color:var(--amber);padding:11px 16px;font-size:13px;
  display:flex;align-items:center;gap:12px;line-height:1.35}
.demobar span{flex:1;min-width:0}
.demobar.warn{background:var(--amberbg);color:var(--amber)}
.demobar.warn button{background:var(--amber);color:var(--card)}
.demobar.bad{background:var(--redbg);color:var(--red)}

/* ---------- slot contents sized to the slot itself ----------
   container queries measure the CONTENT box, rules inside one cannot style

    margin:0;flex:1;min-width:0;font-size:9.5px;line-height:1}

}

@container slot (max-width:36px){ .wall .cargo .slot .code{font-size:9.5px;line-height:1;letter-spacing:-.2px} }

@container slot (max-height:7px){ .wall .cargo .slot .code{display:none} }

<script>
"use strict";
const CATS=[["A","Scene control & safety"],["B","Documentation"],["C","Latent prints"],
["D","Biological / DNA"],["E","Trace"],["F","Impressions"],["G","Firearms / trajectory"],
["H","Packaging & sealing"],["I","Tools & access"],["J","Digital / electronics"],["K","Van infrastructure"]];
const CLASSES=["Consumable","Durable","Reagent","Regulated"];
const STATUSES=["Stocked","Low","Out","Expired","Service due","Not carried"];
const SIDES=["Driver side","Passenger side","Rear doors","Cab"];
// drawn as you see it standing inside the van: facing the driver wall the cab is
// to your right, facing the passenger wall it is to your left
const groupOf = code => String(code).replace(/\d+$/,"");
const bayOf   = code => String(code)[0];
function bayBounds(bay){
  const cs=comps().filter(c=>bayOf(c.code)===bay);
  if(!cs.length)return null;
  const x=Math.min(...cs.map(c=>c.x)), y=Math.min(...cs.map(c=>c.y));
  return {side:cs[0].side, x, y,
    w:Math.max(...cs.map(c=>c.x+c.w))-x, h:Math.max(...cs.map(c=>c.y+c.h))-y, n:cs.length};
}
function vanKey(bay,showEnds){
  const b=bayBounds(bay); if(!b)return "";
  const W=S.walls[b.side]||{cols:144,rows:60};
  return `<div class="vankey">
    <div class="vanwrap${b.side==="Driver side"?" mirrored":""}">
      <div class="wheel f"></div><div class="wheel r"></div>
      <div class="vanbody"><div class="vaninner"></div>
        <div class="cargo" style="grid-template-columns:repeat(${W.cols},minmax(0,1fr));
          grid-template-rows:repeat(${W.rows},minmax(0,1fr));gap:0">
          <div class="here" style="grid-column:${b.x+1}/span ${b.w};grid-row:${b.y+1}/span ${b.h}"></div>
        </div></div></div>
    ${showEnds?`<div class="keyends"><span>${b.side==="Driver side"?"Rear":"Front"}</span><span>${b.side==="Driver side"?"Front":"Rear"}</span></div>`:""}
  </div>`;
}
const BAYNAME={"1":"Bin wall","2":"Drawer bank","3":"Open shelving"};
const WARN=`<svg viewBox="0 0 24 24" class="bico" fill="currentColor"><path d="M12 2.6 1.3 21h21.4L12 2.6Zm0 5.9c.6 0 1 .4 1 1v5a1 1 0 1 1-2 0v-5c0-.6.4-1 1-1Zm0 10.7a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4Z"/></svg>`;
const TICK=`<svg viewBox="0 0 24 24" class="bico" fill="none" stroke="currentColor" stroke-width="2.4"
  stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>`;
function bayTally(bay){
  const cs=comps().filter(c=>bayOf(c.code)===bay).map(c=>compState(c.code));
  const a=cs.filter(s=>s.k==="action").length, t=cs.filter(s=>s.k==="attn").length,
        u=cs.filter(s=>s.k==="unchecked").length;
  return `${a?`<span class="badge b-action">${WARN}${a} need action</span>`:""}
          ${t?`<span class="badge b-attn">${WARN}${t} attention</span>`:""}
          ${u?`<span class="badge b-unchecked">${WARN}${u} not checked</span>`:""}
          ${!a&&!t&&!u?`<span class="badge b-good">${TICK}All good</span>`:""}`;
}
function groupsFor(side){
  const cs=comps().filter(c=>c.side===side), by={};
  cs.forEach(c=>{ const g=groupOf(c.code);
    (by[g]=by[g]||[]).push(c); });
  return Object.keys(by).map(g=>{
    const m=by[g];
    const x=Math.min(...m.map(c=>c.x)), y=Math.min(...m.map(c=>c.y));
    const w=Math.max(...m.map(c=>c.x+c.w))-x, hh=Math.max(...m.map(c=>c.y+c.h))-y;
    const st=m.map(c=>compState(c.code));
    const k=st.some(s=>s.k==="action")?"action":st.some(s=>s.k==="attn")?"attn"
           :st.every(s=>s.k==="good")?"good":"unchecked";
    return {g,x,y,w,h:hh,n:m.length,k,bay:bayOf(g),
            desc:(m[0].desc||"").replace(/,\s*double width$/,"")};
  }).sort((a,b)=>a.y-b.y||a.x-b.x);
}
const capLeft = side => side==="Driver side" ? "Rear doors" : "Front of van";
const capRight = side => side==="Driver side" ? "Front of van" : "Rear doors";
const WALLDEF={"Driver side":{cols:24,rows:12},"Passenger side":{cols:24,rows:12},
 "Rear doors":{cols:12,rows:12},"Cab":{cols:12,rows:8}};

function compState(code){
  const it=live().filter(i=>i.loc===code);
  const rec=S.comps.find(c=>c.code===code);
  if(!it.length)return rec&&rec.checked?{k:"good",label:"Empty",parts:[],items:it}
    :{k:"unchecked",label:"Not checked",parts:[],items:it};
  const bad=i=>isOut(i)||isExpired(i);
  const out=it.filter(isOut).length, exp=it.filter(i=>isExpired(i)&&!isOut(i)).length;
  const low=it.filter(i=>isLow(i)&&!bad(i)).length;
  const soon=it.filter(i=>isExpiring(i)&&!bad(i)).length, svc=it.filter(i=>isService(i)&&!bad(i)).length;
  const p=[];
  if(out)p.push(out+" out"); if(exp)p.push(exp+" expired");
  if(low)p.push(low+" low"); if(soon)p.push(soon+" expiring"); if(svc)p.push(svc+" service");
  if(out||exp)return{k:"action",label:p.join(", "),parts:p,items:it};
  if(low||soon||svc)return{k:"attn",label:p.join(", "),parts:p,items:it};
  return{k:"good",label:it.length+(it.length===1?" item":" items"),parts:[],items:it};
}

const b64enc=s=>{const b=new TextEncoder().encode(s);let out="";
  for(let i=0;i<b.length;i+=8192)out+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  return btoa(out)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const ghOn=()=>!!(S.gh.owner&&S.gh.repo&&S.gh.token);

const ghHead=()=>({Authorization:"Bearer "+S.gh.token,Accept:"application/vnd.github+json",

    const c=Object.assign({},f);delete c.fills;return c}),walls:S.walls,demo:S.demo,
  lastCat:S.lastCat,lastCls:S.lastCls,savedAt:new Date().toISOString()});

async function ghPull(silent){
  if(!ghOn())return;
  try{
    const r=await fetch(ghURL()+"?ref=HEAD&t="+Date.now(),{headers:ghHead(),cache:"no-store"});
    if(r.status===404){S.gh.sha="";store.set(S);if(!silent)toast("No data file yet — push to create it");return"empty"}
    if(!r.ok)throw new Error(r.status===401?"Token rejected":r.status===403?"No access to that repo":"GitHub error "+r.status);
    const j=await r.json(), o=JSON.parse(b64dec(j.content));
    S.items=o.items||[];S.comps=o.comps||[];S.forms=o.forms||[];if(o.walls)S.walls=o.walls;S.demo=!!o.demo;
    S.gh.sha=j.sha;S.gh.last=new Date().toISOString();dirty=false;conflict=false;
    syncErr="";retries=0;clearTimeout(pushT);store.set(S);renderSyncBar();
    if(!silent)toast("Pulled "+S.items.length+" items");render();return"ok";
  }catch(e){if(!silent)toast(e.message||"Pull failed");return"error"}
}
async function ghPush(force){
  if(!ghOn())return;
  try{
    const body={message:"Van inventory — "+new Date().toISOString().slice(0,16).replace("T"," "),
      content:b64enc(JSON.stringify(payload(),null,1))};
    if(S.gh.sha&&!force)body.sha=S.gh.sha;
    else if(force){const r0=await fetch(ghURL(),{headers:ghHead(),cache:"no-store"});
      if(r0.ok){const j0=await r0.json();body.sha=j0.sha}}
    const r=await fetch(ghURL(),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},ghHead()),
      body:JSON.stringify(body)});
    if(r.status===409||r.status===422){conflict=true;store.set(S);renderData();
      return toast("Someone else changed the data — see Sync")}
    if(!r.ok)throw new Error(r.status===401?"Token rejected":r.status===403?"No write access":"GitHub error "+r.status);
    const j=await r.json();S.gh.sha=j.content.sha;S.gh.last=new Date().toISOString();
    dirty=false;conflict=false;syncErr="";retries=0;store.set(S);
    renderSyncBar();renderData();return"ok";
  }catch(e){
    syncErr=e.message||"Couldn't reach GitHub";
    store.set(S);renderSyncBar();
    clearTimeout(pushT);pushT=setTimeout(()=>ghPush(false),retryIn());
    return "error"}
}
let retries=0;
function retryIn(){retries=Math.min(retries+1,6);return Math.min(60000,2000*Math.pow(2,retries-1))}
function queuePush(){ if(!ghOn())return; dirty=true; retries=0;
  clearTimeout(pushT); pushT=setTimeout(()=>ghPush(false),2500);
  renderSyncPill(); renderSyncBar(); }
function renderSyncBar(){
  const b=$("#syncbar"); if(!b)return;
  const offline=typeof navigator!=="undefined"&&navigator.onLine===false;
  if(!ghOn()||(!dirty&&!syncErr&&!conflict)){b.style.display="none";b.innerHTML="";fitHeader();return}
  let msg,cls;
  if(conflict){cls="bad";msg="Another device changed the data. Open Sync to choose which version wins."}
  else if(offline){cls="warn";msg="No connection. Your changes are saved on this phone and will push when you're back online."}
  else if(syncErr){cls="bad";msg=syncErr+". Retrying — your changes are still saved on this phone."}
  else {b.style.display="none";b.innerHTML="";fitHeader();return}
  b.className="demobar "+cls; b.style.display="";
  b.innerHTML=`<span>${esc(msg)}</span><button id="syncnow">${conflict?"Open Sync":"Retry"}</button>`;
  fitHeader();
}
function renderSyncPill(){
  const el=$("#syncpill"); if(!el)return;
  el.textContent=conflict?"Conflict":dirty?"Saving…":S.gh.last?"Synced "+S.gh.last.slice(11,16):"Not synced";

function autoPlace(side){
  const W=S.walls[side]||{cols:24,rows:12};
  const mine=S.comps.filter(c=>c.side===side);
  const grid=[];for(let r=0;r<W.rows;r++)grid.push(new Array(W.cols).fill(false));
  const mark=(c)=>{for(let r=c.y;r<Math.min(W.rows,c.y+c.h);r++)
    for(let x=c.x;x<Math.min(W.cols,c.x+c.w);x++)grid[r][x]=true};
  const fits=(x,y,w,hh)=>{if(x+w>W.cols||y+hh>W.rows)return false;
    for(let r=y;r<y+hh;r++)for(let q=x;q<x+w;q++)if(grid[r][q])return false;return true};
  mine.filter(c=>c.x!=null&&c.y!=null).forEach(mark);
  mine.filter(c=>c.x==null||c.y==null).forEach(c=>{
    outer:for(let y=0;y<W.rows;y++)for(let x=0;x<W.cols;x++)
      if(fits(x,y,c.w,c.h)){c.x=x;c.y=y;mark(c);break outer}
    if(c.x==null){c.x=0;c.y=0}});
}

function itemStatus(i){
  if(isOut(i))return["action","Out of stock"];
  if(isExpired(i))return["action","Expired"];
  if(isLow(i))return["attn","Below par"];
  if(isService(i))return["attn","Service due"];
  if(isExpiring(i))return["attn","Expires in "+daysOut(i.date)+" days"];
  return["good","Good"];
}
function miniWall(code){
  const c=S.comps.find(x=>x.code===code);
  if(!c||!SIDES.includes(c.side))return "";
  SIDES.forEach(autoPlace);
  if(c.x==null||c.y==null)return "";
  const W=S.walls[c.side]||{cols:24,rows:12};
  const mine=comps().filter(o=>o.side===c.side&&o.x!=null);
  return `<div class="mini">
    <div class="minihead">${esc(c.side)}</div>
    <div class="minigrid" style="grid-template-columns:repeat(${W.cols},minmax(0,1fr));grid-template-rows:repeat(${W.rows},minmax(0,1fr));gap:${W.cols>60?1:2}px">
      ${mine.map(o=>`<div class="mslot${o.code===c.code?" hit":""}"
        style="grid-column:${o.x+1}/span ${o.w};grid-row:${o.y+1}/span ${o.h}"
        >${o.code===c.code?esc(o.code):""}</div>`).join("")}
    </div>
    <div class="miniorient"><span>${capLeft(c.side)}</span><span>${capRight(c.side)}</span></div>
  </div>`;
}

}

function relSheet(it){
  const draw=(q)=>{
    const ql=(q||"").toLowerCase();
    const list=live().filter(o=>o.id!==it.id)
      .filter(o=>!ql||(o.name+" "+o.loc+" "+catName(o.cat)).toLowerCase().includes(ql))
      .sort((a,b)=>{const s=(it.rel||[]).includes(b.id)-(it.rel||[]).includes(a.id);
        return s||a.name.localeCompare(b.name)}).slice(0,60);
    $("#rellist").innerHTML=list.map(o=>{const on=(it.rel||[]).includes(o.id);
      return `<button class="relrow${on?" on":""}" data-pick="${o.id}">
        <span class="tick">${on?"&#10003;":""}</span>
        <span><span class="rn">${esc(o.name)}</span><span class="rl">${esc(o.loc||"—")} · ${esc(catName(o.cat))}</span></span>
      </button>`}).join("")||`<p class="hint">Nothing matches that.</p>`;
  };
  openSheet(`<h3>Works with</h3>
    <p style="margin:0 0 12px;color:var(--ink2);font-size:14.5px">Pick the gear used alongside ${esc(it.name)}. Links go both ways.</p>
    <input type="text" id="relq" placeholder="Search items" autocomplete="off">
    <div id="rellist" class="rellist" style="margin-top:10px"></div>
    <button class="btn" id="reldone" style="max-width:none;margin-top:12px">Done</button>`);
  draw("");
  $("#relq").oninput=e=>draw(e.target.value);
  $("#reldone").onclick=()=>{closeSheet();renderItemDetail()};
  $("#rellist").onclick=e=>{
    const b=e.target.closest("[data-pick]"); if(!b)return;
    const o=S.items.find(x=>x.id===b.dataset.pick); if(!o)return;
    it.rel=it.rel||[]; o.rel=o.rel||[];
    if(it.rel.includes(o.id)){it.rel=it.rel.filter(x=>x!==o.id);o.rel=o.rel.filter(x=>x!==it.id)}
    else{it.rel.push(o.id);o.rel.push(it.id)}
    save();draw($("#relq").value);
  };
}


/* ---------- printable van map ---------- */
function renderPrint(){
  $("#title").textContent="Printable map";
  const cs=comps();
  const bays=[...new Set(cs.map(c=>bayOf(c.code)))].sort();

  // one block per unit, drawn to its own scale so the labels fit
  const unit=bay=>{
    const mine=cs.filter(c=>bayOf(c.code)===bay);
    if(!mine.length)return "";
    const minX=Math.min(...mine.map(c=>c.x)), minY=Math.min(...mine.map(c=>c.y));
    const W=Math.max(...mine.map(c=>c.x+c.w))-minX, H=Math.max(...mine.map(c=>c.y+c.h))-minY;
    const side=mine[0].side;
    return `<section class="punit">
      <h3>${esc(BAYNAME[bay]||"Bay "+bay)}
        <span>${esc(side)} · ${W}&Prime; wide · ${mine.length} compartments</span></h3>
      <div class="pgrid" style="grid-template-columns:repeat(${W},minmax(0,1fr));
        grid-template-rows:repeat(${H},minmax(0,1fr));aspect-ratio:${(W/H).toFixed(3)}">
        ${mine.map(c=>`<div class="pslot"
          style="grid-column:${c.x-minX+1}/span ${c.w};grid-row:${c.y-minY+1}/span ${c.h}">
          <b>${esc(c.code)}</b>${c.desc?`<i>${esc(c.desc)}</i>`:""}</div>`).join("")}
      </div>
      <div class="porient"><span>${capLeft(side)}</span><span>${capRight(side)}</span></div>
    </section>`};

  const rows=cs.filter(c=>SIDES.includes(c.side)).map(c=>{
    const it=live().filter(i=>i.loc===c.code);
    return `<tr><td class="pc">${esc(c.code)}</td><td>${esc(c.desc||"")}</td>
      <td class="pn">${it.length}</td></tr>`}).join("");

  $("#v-print").innerHTML=`
    <div class="noprint" style="display:flex;gap:8px;margin-bottom:14px;align-items:center">
      <button class="back" data-go="compartments" style="margin:0;align-self:center">&#8249; Compartments</button>
      <button class="btn" id="doprint" style="margin:0;max-width:none">Print</button></div>
    <p class="hint noprint" style="margin:0 0 16px">A page per unit plus a full index, to tape inside
      the van. Print from Safari on a computer if the Print button does nothing — the home screen
      version has no print menu.</p>
    <div class="psheet">
      <div class="phead"><b>Van compartment map</b><span>${esc(today())}</span></div>
      ${bays.map(unit).join("")}
      <h3 class="plist">Compartment index</h3>
      <table class="ptab"><thead><tr><th>Code</th><th>What it holds</th><th>Items</th></tr></thead>
        <tbody>${rows}</tbody></table>
    </div>`;
}

/* ---------- form fields and filled copies ---------- */
const FTYPES=["text","textarea","date","time","number","check","table"];
function parseFields(t){
  return (t||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map((l,ix)=>{
    const b=l.split("|").map(x=>x.trim());
    const label=b[0]; let type=(b[1]||"text").toLowerCase();
    if(!FTYPES.includes(type))type="text";
    const cols=type==="table"?(b[2]||"Item").split(",").map(x=>x.trim()).filter(Boolean):null;
    return {id:"f"+ix+"_"+label.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,12),label,type,cols};
  });
}
const fieldsText=f=>(f.fields||[]).map(x=>
  x.type==="table"?x.label+" | table | "+(x.cols||[]).join(", ")
  :x.type==="text"?x.label:x.label+" | "+x.type).join("\n");

function newFill(f){
  const rec={id:newId(),formId:f.id,formName:f.name,rev:f.rev||"",cat:f.cat||"",
    started:new Date().toISOString(),values:{}};
  (f.fields||[]).forEach(x=>{rec.values[x.id]=x.type==="table"?[{}]:x.type==="check"?false:""});
  S.fills.push(rec); saveLocal(); return rec;
}
function fillTitle(r){
  const f=S.forms.find(x=>x.id===r.formId);
  const first=(f&&(f.fields||[]).find(x=>["text","number"].includes(x.type)));
  const v=first?String(r.values[first.id]||"").trim():"";
  return v||("Started "+r.started.slice(0,16).replace("T"," "));
}

  const t=Date.parse(f.verified); return !isNaN(t)&&(Date.now()-t)/86400000>365 }

  $("#title").textContent="Forms";

    +open.map(r=>`<button class="row" data-fill="${r.id}">

    +`</div><p class="hint">These are on this phone only. Export each one and clear it.</p>`:"";

  const stale=fs.filter(formStale).length, unver=fs.filter(f=>!f.verified).length;
  const g={}; fs.forEach(f=>{const k=f.cat||"Admin";(g[k]=g[k]||[]).push(f)});
  const badge=f=>formStale(f)?`<span class="badge b-action">Re-check</span>`
    :!f.verified?`<span class="badge b-attn">Unverified</span>`
    :`<span class="badge b-good">${esc(f.verified.slice(0,7))}</span>`;
  $("#v-forms").innerHTML=bar
    +((stale||unver)?`<div class="unver">${stale?stale+(stale===1?" form hasn't":" forms haven't")+" been checked in over a year. ":""}${unver?unver+(unver===1?" has":" have")+" no checked date. ":""}Forms get revised — confirm you're carrying the current one.</div>`:"")
    +FORMCATS.filter(k=>g[k]).concat(Object.keys(g).filter(k=>!FORMCATS.includes(k))).map(k=>

    +openBlock;
}

/* ---------- pdf ---------- */
let jsPDFlib=null;
function loadPDF(){
  if(jsPDFlib)return Promise.resolve(jsPDFlib);
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>{jsPDFlib=(window.jspdf||{}).jsPDF;
      jsPDFlib?res(jsPDFlib):rej(new Error("PDF library loaded oddly"))};
    s.onerror=()=>rej(new Error("Couldn't load the PDF tool. Do one export on wifi and it stays cached."));
    document.head.appendChild(s);
  });
}
async function exportFill(r){
  const f=S.forms.find(x=>x.id===r.formId)||{fields:[]};
  let JsPDF; try{ JsPDF=await loadPDF() }catch(e){ return toast(e.message) }
  const doc=new JsPDF({unit:"pt",format:"letter"});
  const M=54, W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  let y=M;
  const page=()=>{doc.setFontSize(8);doc.setTextColor(120);
    doc.text("Captured "+new Date().toISOString().slice(0,16).replace("T"," ")+"  ·  page "+doc.internal.getNumberOfPages(),M,H-28);
    doc.setTextColor(0)};
  const need=n=>{if(y+n>H-56){page();doc.addPage();y=M}};
  doc.setFont("helvetica","bold");doc.setFontSize(16);
  doc.text(String(r.formName),M,y);y+=20;
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(90);
  doc.text([r.rev?"Revision "+r.rev:"",r.cat||""].filter(Boolean).join("  ·  "),M,y);y+=12;
  doc.text("Started "+r.started.slice(0,16).replace("T"," "),M,y);y+=8;
  doc.setTextColor(0);doc.setDrawColor(30);doc.setLineWidth(1);
  doc.line(M,y,W-M,y);y+=20;
  (f.fields||[]).forEach(x=>{
    const v=r.values[x.id];
    if(x.type==="table"){
      const rows=(Array.isArray(v)?v:[]).filter(row=>Object.values(row||{}).some(s=>String(s||"").trim()));
      need(40);doc.setFont("helvetica","bold");doc.setFontSize(9);doc.text(String(x.label),M,y);y+=13;
      const cols=x.cols||[],cw=(W-2*M)/Math.max(1,cols.length);
      doc.setFontSize(8);doc.setTextColor(90);
      cols.forEach((c,i)=>doc.text(String(c),M+i*cw+3,y));
      doc.setTextColor(0);y+=4;doc.setLineWidth(.5);doc.setDrawColor(150);
      doc.line(M,y,W-M,y);y+=12;
      doc.setFont("helvetica","normal");doc.setFontSize(9);
      (rows.length?rows:[{}]).forEach(row=>{need(18);
        cols.forEach((c,i)=>{const cell=doc.splitTextToSize(String(row[c]||""),cw-6);
          doc.text(cell.slice(0,1),M+i*cw+3,y)});

async function exportSketch(sk){
  let JsPDF; try{ JsPDF=await loadPDF() }catch(e){ return toast(e.message) }
  const portrait=!!sk.portrait;
  const doc=new JsPDF({unit:"pt",format:"letter",orientation:portrait?"portrait":"landscape"});
  const M=40, W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  let y=M;

  // header block, same information as the one drawn on the canvas
  doc.setFont("helvetica","bold");doc.setFontSize(17);
  doc.text(sk.caseNo||"Untitled sketch",M,y+4);
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(90);
  const right=[];
  if(sk.when)right.push(String(sk.when).replace("T"," "));
  if(sk.by)right.push("Sketched by "+sk.by);
  right.forEach((t,i)=>doc.text(t,W-M,y-2+i*12,{align:"right"}));
  y+=18;
  if(sk.addr){doc.setFontSize(11);doc.setTextColor(0);doc.text(sk.addr,M,y);y+=8}
  doc.setDrawColor(20);doc.setLineWidth(1.4);doc.line(M,y,W-M,y);y+=14;

  // crop to what is actually drawn, so the sketch fills the page
  const objs=sk.objs||[];
  const PAD=45;
  let bx=Math.min(...objs.map(o=>o.x))-PAD, by=Math.min(...objs.map(o=>o.y))-PAD;
  let bw=Math.max(...objs.map(o=>o.x+o.w))+PAD-bx, bh=Math.max(...objs.map(o=>o.y+o.h))+PAD-by;
  bx=Math.max(0,bx); by=Math.max(0,by);
  bw=Math.min(bw,pageW(sk)-bx); bh=Math.min(bh,pageH(sk)-by);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(bw*2)}" height="${Math.round(bh*2)}"
      viewBox="${bx} ${by} ${bw} ${bh}"><rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="#fff"/>
      ${objs.map(o=>objSVG(o,false)).join("")}</svg>`;
  const vbW=bw, vbH=bh;
  const styled=svg.replace("</svg>",`<style>
      .k-line{fill:none;stroke:var(--kc,#111);stroke-width:2}
      .k-fill,.k-solid{fill:var(--kc,#111)}
      .k-stroke{stroke:var(--kc,#111);stroke-width:1.6;fill:none}
      .k-thin{stroke:var(--kc,#111);stroke-width:1;fill:none}
      .k-thick{stroke:var(--kc,#111);stroke-width:3.4;fill:none;stroke-linecap:round}
      .k-dash{stroke:var(--kc,#111);stroke-width:2;fill:none;stroke-dasharray:8 6}
      .k-text,.k-tag{fill:var(--kc,#111);font-family:sans-serif}
      .k-num{fill:#fff;font-family:sans-serif;font-weight:700}
      .k-legt,.k-legn,.k-legr{fill:var(--kc,#111);font-family:sans-serif}
      .k-legu{fill:#888;font-family:sans-serif;font-style:italic}
    </style></svg>`);
  const png=await svgToPNG(styled, Math.round(vbW*2), Math.round(vbH*2));
  const hasOwnLegend=(sk.objs||[]).some(o=>o.t==="legend");
  const markerList=hasOwnLegend?[]:(sk.objs||[]).filter(o=>o.t==="marker")
    .sort((a,b)=>(parseInt(a.n,10)||0)-(parseInt(b.n,10)||0));
  const legendH = markerList.length ? 34+markerList.length*13 : 0;
  const availW=W-2*M, availH=H-y-M-legendH-24;
  let dw=availW, dh=dw*vbH/vbW;
  if(dh>availH){dh=availH;dw=dh*vbW/vbH}
  doc.addImage(png,"PNG",M+(availW-dw)/2,y,dw,dh,undefined,"MEDIUM");
  y+=dh+16;

  // the marker index, printed rather than drawn, so nothing is cut off
  const markers=markerList;
  if(markers.length){
    if(y>H-M-40){doc.addPage();y=M}
    doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(0);
    doc.text("Legend",M,y);y+=6;
    doc.setDrawColor(120);doc.setLineWidth(.6);doc.line(M,y,W-M,y);y+=13;
    doc.setFontSize(9.5);
    markers.forEach((m,i)=>{
      const ly=y+i*13;
      doc.setFont("helvetica","bold");doc.text(String(m.n||"?"),M,ly);
      doc.setFont("helvetica","normal");
      const nm=(m.label||"").trim();
      doc.setTextColor(nm?0:150);
      doc.text(nm||"not named",M+20,ly);
      doc.setTextColor(0);
    });
    y+=markers.length*13+6;
  }
  doc.setFontSize(8);doc.setTextColor(120);
  doc.text("Not to scale unless marked. Exported "+new Date().toISOString().slice(0,16).replace("T"," "),
    M,H-24);

  const safe=String(sk.caseNo||"sketch").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  const name=safe+"-sketch-"+new Date().toISOString().slice(0,10)+".pdf";
  const blob=doc.output("blob");
  try{
    const file=new File([blob],name,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:sk.caseNo||"Scene sketch"});
      return toast("Shared");
    }
  }catch(e){ if(e&&e.name==="AbortError")return; }
  const u=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
  toast("Sketch exported");
}
function svgToPNG(svg,w,hh){
  return new Promise((res,rej)=>{
    const img=new Image();
    const blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    img.onload=()=>{
      const c=document.createElement("canvas");c.width=w;c.height=hh;
      const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,hh);
      ctx.drawImage(img,0,0,w,hh);URL.revokeObjectURL(url);
      res(c.toDataURL("image/png"));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Couldn't render the sketch"))};
    img.src=url;
  });
}

    const g=document.querySelector(`[data-obj="${o.id}"]`);
    if(g)g.setAttribute("transform",`translate(${o.x},${o.y}) rotate(${o.r} ${o.w/2} ${o.h/2})`);
    const f=$("#rotval"); if(f)f.textContent=o.r+"\u00b0";
    e.preventDefault();return;
  }
  const dx=p.x-drag.px, dy=p.y-drag.py;
  if(drag.mode==="move"){
    const sk0=S.sketches.find(x=>x.id===curSketch);
    const top=sk0&&hasHeader(sk0)?HEADER_H+2:-o.h*.4;
    o.x=Math.max(-o.w*.4,Math.min(pageW(sk0)-o.w*.6,drag.x+dx));
    o.y=Math.max(top,Math.min(pageH(sk0)-o.h*.6,drag.y+dy));
  }else if(LOCKED.has(o.t)){
    const sw=(drag.w+dx)/drag.w, sh=(drag.h+dy)/drag.h;
    const minS=16/Math.min(drag.w,drag.h);
    const s=Math.max(minS,(sw+sh)/2);
    o.w=drag.w*s; o.h=drag.h*s;
  }else{
    o.w=Math.max(16,drag.w+dx); o.h=Math.max(16,drag.h+dy);
  }
  const g=document.querySelector(`[data-obj="${o.id}"]`);
  if(g){
    if(drag.mode==="move")g.setAttribute("transform",
      `translate(${o.x},${o.y}) rotate(${o.r||0} ${o.w/2} ${o.h/2})`);
    else g.outerHTML=objSVG(o,true);
  }
  e.preventDefault();
},{passive:false});
document.addEventListener("pointerup",()=>{ if(!drag)return;
  const o=drag.o;
  o.x=Math.round(o.x);o.y=Math.round(o.y);
  if(drag.mode==="rot"){drag=null;saveLocal();renderSketch();return}
  if(drag.mode==="size"&&LOCKED.has(o.t)){
    const ar=o.ar||(drag.w/drag.h);
    o.w=Math.max(16,Math.round(o.w));
    o.h=Math.max(12,Math.round(o.w/ar));
  }else{o.w=Math.round(o.w);o.h=Math.round(o.h)}
  drag=null;saveLocal();renderSketch();});

const STALE_MONTHS=12;
function verifyAge(i){ if(!i.verified)return null;
  const t=Date.parse(i.verified); if(isNaN(t))return null;
  return (Date.now()-t)/86400000/30.44 }
const isStale=i=>{const m=verifyAge(i);return m!==null&&m>STALE_MONTHS};

function parseGuides(text){
  const byName={}; live().forEach(i=>{byName[i.name.trim().toLowerCase()]=i});
  const blocks=[]; let cur=null, afterBlank=true;
  const isStep=l=>/^\s*(?:[-*\u2022]|\d+[.)])\s+/.test(l);
  const strip=l=>l.replace(/^\s*(?:[-*\u2022]|\d+[.)])\s+/,"").trim();
  text.split(/\r?\n/).forEach(raw=>{
    const l=raw.trim();
    if(!l){afterBlank=true;return}
    const attr=/^(source|verified)\s*:/i.exec(l);
    if(attr&&cur){cur[attr[1].toLowerCase()]=l.slice(l.indexOf(":")+1).trim();afterBlank=false;return}
    if(afterBlank&&!isStep(l)){
      const hit=byName[l.toLowerCase().replace(/:$/,"")];
      cur={item:hit||null,name:l,steps:[],source:"",verified:""};
      blocks.push(cur);afterBlank=false;return;
    }
    if(cur)cur.steps.push(isStep(l)?strip(l):l);
    afterBlank=false;
  });
  return blocks;
}
function applyGuides(text){
  const blocks=parseGuides(text);
  const good=blocks.filter(b=>b.item&&b.steps.length);
  const miss=blocks.filter(b=>!b.item&&b.steps.length).map(b=>b.name);
  good.forEach(b=>{b.item.steps=b.steps;
    if(b.source)b.item.source=b.source;
    if(b.verified&&/^\d{4}-\d{2}-\d{2}$/.test(b.verified))b.item.verified=b.verified});
  if(good.length)save();
  return {n:good.length,miss:[...new Set(miss)]};
}

/* ---------- data and backup ---------- */
const COLS=["name","loc","cat","cls","qty","par","date","status","gapType","note","source","verified"];
const HEAD=["Item","Compartment","Category","Class","Qty","Par","Date","Status","Gap type","Note","Source","Verified"];
const cell=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=()=>[HEAD.concat("Instructions").join(",")].concat(
  S.items.map(i=>COLS.map(c=>cell(i[c])).concat(cell((i.steps||[]).join(" | "))).join(","))).join("\n");
function parseCSV(t){const rows=[];let row=[],f="",q=false;
  for(let x=0;x<t.length;x++){const c=t[x];
    if(q){if(c==='"'){if(t[x+1]==='"'){f+='"';x++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[x+1]==="\n")x++;row.push(f);f="";
      if(row.some(v=>v!==""))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(v=>v!==""))rows.push(row);return rows}
function download(text,name,type){
  try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
    S.lastBackup=today();save();return true}catch(e){return false}}
function ingest(text,replace){
  text=(text||"").trim(); if(!text)return toast("Nothing pasted");
  if(text[0]==="{"){let o;try{o=JSON.parse(text)}catch(e){return toast("That backup didn't parse")}
    if(!o.items)return toast("No items in that file");
    if(replace){S.items=o.items;S.comps=o.comps||[];S.forms=o.forms||[];if(o.walls)S.walls=o.walls;S.demo=!!o.demo}
    else o.items.forEach(x=>{x.id=newId();S.items.push(x)});
    save();renderData();return toast(o.items.length+" items "+(replace?"restored":"added"))}
  const rows=parseCSV(text); if(rows.length<2)return toast("Nothing to import");
  const add=[];
  rows.slice(1).forEach(r=>{if(!r[0]||!r[0].trim())return;
    const o={id:newId(),uses:[],fav:false};
    COLS.forEach((c,j)=>o[c]=(r[j]??"").trim());
    o.qty=n(o.qty); o.steps=(r[COLS.length]||"").split(" | ").map(s=>s.trim()).filter(Boolean);
    if(!STATUSES.includes(o.status))o.status="Stocked";
    if(!CATS.some(c=>c[0]===o.cat))o.cat="A";
    if(!CLASSES.includes(o.cls))o.cls="Consumable";
    add.push(o)});
  if(replace)S.items=add; else S.items=S.items.concat(add);
  add.forEach(o=>{if(o.loc&&!S.comps.some(c=>c.code===o.loc))
    S.comps.push({code:o.loc,desc:"",side:"",x:null,y:null,w:6,h:4})});
  save();renderData();toast(add.length+" rows "+(replace?"loaded":"added"));
}

/* ---------- filtered lists from the strip ---------- */
let listKey=null;
function renderList(key){
  const L=live();
  const map={low:["Low or out",L.filter(i=>isOut(i)||isLow(i))],
    expiring:["Expiring",L.filter(i=>isExpiring(i)||isExpired(i)||isService(i))],
    gaps:["Gaps to decide",gaps()],all:["All items",L]};
  const [t,arr]=map[key]||map.all;
  $("#title").textContent=t;
  listKey=key;
  $("#v-home").innerHTML=`<button class="back" data-go="home">&#8249; Home</button>`
    +(key==="gaps"?`<button class="btn sec" id="addgap" style="margin:0 0 14px;max-width:none">Log something we don't carry</button>`:"")
    +(arr.length?`<div class="rows">`+arr.map(i=>{
      const s=isOut(i)?["action","Out"]:isExpired(i)?["action","Expired"]:isLow(i)?["attn","Below par"]
        :isService(i)?["attn","Service due"]:isExpiring(i)?["attn",daysOut(i.date)+" days"]:["good","OK"];
      return `<button class="row" data-item="${i.id}">
        <span><span class="code">${esc(i.name)}</span>
        <span class="desc">${esc(i.loc||"—")} · ${esc(i.qty)} in stock${i.par?" · par "+esc(i.par):""}</span></span>
        <span class="rt"><span class="badge b-${s[0]}">${esc(s[1])}</span><span class="chev">&#8250;</span></span></button>`
      }).join("")+`</div>`
    :`<div class="empty"><strong>Nothing here</strong><p>That list is clear.</p></div>`);
}

/* ---------- search ---------- */
function renderSearch(){
  $("#title").textContent="Search";
  const q=query.toLowerCase();
  const notCarried=S.items.filter(i=>i.status==="Not carried"&&i.gapType!=="request");
  const pool=live().concat(requests(),notCarried);
  const hay=i=>(i.name+" "+i.loc+" "+i.cat+" "+catName(i.cat)+" "+i.cls+" "+(i.contact||"")
    +" "+(i.note||"")+" "+(i.steps||[]).join(" ")
    +" "+((S.comps.find(c=>c.code===i.loc)||{}).desc||"")).toLowerCase();
  const all=pool.filter(i=>hay(i).includes(q));
  const hits=all.slice(0,40);
  const fhits=S.forms.filter(f=>((f.name||"")+" "+(f.desc||"")+" "+(f.cat||"")+" "+(f.rev||"")).toLowerCase().includes(q)).slice(0,8);
  $("#v-search").innerHTML=hits.length
    ? `<div class="sect">${all.length>hits.length?"Showing "+hits.length+" of "+all.length:hits.length+" result"+(hits.length===1?"":"s")}</div><div class="rows">`
      +hits.map(i=>{const cp=S.comps.find(c=>c.code===i.loc);
        return `<button class="row" data-item="${i.id}">
          <span><span class="code">${esc(i.name)}</span>
          <span class="desc">${isRequest(i)?esc(i.contact||"Not in the van")
            :i.status==="Not carried"?"Not in the van"+(i.note?" · "+esc(i.note):"")
            :esc(i.loc||"—")+(cp&&cp.desc?" · "+esc(cp.desc):"")+" · "+esc(i.qty)+" in stock"}</span></span>
          <span class="rt">${isRequest(i)?`<span class="badge b-req">On request</span>`
            :i.status==="Not carried"?`<span class="badge b-${i.gapType==="deliberate"?"unchecked":"action"}">${i.gapType==="deliberate"?"Not carried":"Gap"}</span>`
            :""}<span class="chev">&#8250;</span></span></button>`}).join("")+`</div>`
    : `<div class="empty"><strong>Nothing found</strong><p>No item, compartment, or category matches that.</p></div>`;
  if(fhits.length)$("#v-search").insertAdjacentHTML("beforeend",
    `<div class="sect">Forms — ${fhits.length}</div><div class="rows">`+fhits.map(f=>
      `<button class="row" data-form="${f.id}">
        <span><span class="code">${esc(f.name)}</span>
        <span class="desc">${esc(f.rev?"Rev "+f.rev+" · ":"")}${esc(f.cat||"")}</span></span>
        <span class="rt"><span class="badge b-req">Form</span><span class="chev">&#8250;</span></span></button>`).join("")+`</div>`);
  if(all.length>hits.length)$("#v-search").insertAdjacentHTML("beforeend",
    `<p class="hint">Add another word to narrow it down.</p>`);
}

          <label class="fld"><span>Class</span><select id="f-cls">${CLASSES.map(c=>`<option${c===S.lastCls?" selected":""}>${c}</option>`).join("")}</select></label></div>

      </div>
      <div id="sweeplist">${here.length?`<div class="sect">In ${esc(cur)} — ${here.length}</div><div class="rows">`
        +here.slice().reverse().map(i=>`<button class="row" data-item="${i.id}">
          <span><span class="code">${esc(i.name)}</span><span class="desc">${esc(i.qty)} in stock${i.par?" · par "+esc(i.par):""}</span></span>

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g)return go(g.dataset.go);
  const bg=e.target.closest("[data-back]"); if(bg&&view==="compdetail"){
    view="compartments";$$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-compartments"));
    render();return restoreScroll("compartments")}
  const l=e.target.closest("[data-list]"); if(l){view="home";return renderList(l.dataset.list)}
  const bh=e.target.closest("[data-bay]");
  if(bh){rememberScroll();prevView="compartments";curBay=bh.dataset.bay;
    view="bay";window.scrollTo&&window.scrollTo(0,0);return render()}
  const c=e.target.closest("[data-comp]");
  if(c){
    rememberScroll();prevView=view==="bay"?"bay":"compartments";curComp=c.dataset.comp;view="compdetail";
    $$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-compdetail"));
    window.scrollTo&&window.scrollTo(0,0);return render()}
  const ec=e.target.closest("[data-editcomp]");
  if(ec){const c=S.comps.find(x=>x.code===ec.dataset.editcomp); if(!c)return;
    const held=live().filter(i=>i.loc===c.code).length;
    openSheet(`<h3>Edit compartment</h3>
      <div class="two"><label class="fld"><span>Code</span>
        <input type="text" id="cc" value="${esc(c.code)}" autocapitalize="characters"></label>
      <label class="fld"><span>Side of the van</span><select id="cs">
        <option value="">Not placed</option>${SIDES.map(z=>`<option${z===c.side?" selected":""}>${z}</option>`).join("")}</select></label></div>
      <label class="fld"><span>Where it is, in plain words</span>
        <input type="text" id="cd" value="${esc(c.desc||"")}" placeholder="Drawer 3, left"></label>
      <p class="hint" style="margin:0 0 14px">${held?"Renaming moves all "+held+" item"+(held===1?"":"s")+" in here with it.":"Nothing logged in here yet."}</p>
      <button class="btn" id="csave" style="max-width:none;margin:0">Save</button>
      <button class="btn sec" id="cdel" style="max-width:none;color:var(--red);border-color:var(--red)">Delete compartment</button>
      <button class="btn sec" id="cx" style="max-width:none">Cancel</button>`);
    $("#cx").onclick=closeSheet;
    $("#cdel").onclick=()=>askConfirm("Delete compartment",
      held?"The "+held+" item"+(held===1?"":"s")+" in "+c.code+" stay in the van but lose their compartment. You can reassign them from each item.":"Nothing is in "+c.code+", so nothing else changes.",
      "Delete compartment",true,()=>{
        S.items.forEach(i=>{if(i.loc===c.code)i.loc=""});
        S.comps=S.comps.filter(x=>x.code!==c.code);
        if(S.curLoc===c.code)S.curLoc="";
        save();go("compartments");toast(c.code+" deleted")});
    $("#csave").onclick=()=>{
      const nu=$("#cc").value.trim().toUpperCase();
      if(!nu)return toast("Needs a code");
      if(nu!==c.code&&S.comps.some(x=>x.code===nu))return toast(nu+" already exists");
      const old=c.code;
      if(nu!==old){S.items.forEach(i=>{if(i.loc===old)i.loc=nu});
        if(S.curLoc===old)S.curLoc=nu; c.code=nu; curComp=nu}
      c.side=$("#cs").value; c.desc=$("#cd").value.trim();
      save();closeSheet();renderCompDetail();toast("Saved")};
    return}
  const ah=e.target.closest("[data-addhere]");
  if(ah){S.curLoc=ah.dataset.addhere;save();return go("sweep")}
  const ck=e.target.closest("[data-check]");
  if(ck){const cc=S.comps.find(x=>x.code===ck.dataset.check);
    if(cc){cc.checked=new Date().toISOString().slice(0,10);save();renderCompDetail();toast(cc.code+" marked swept")}
    return}
  if(e.target.closest("#doprint")){window.print&&window.print();return}
  const sf=e.target.closest("[data-skfull]");
  if(sf){setFull(sf.dataset.skfull==="1");return}
  const st=e.target.closest("[data-sktools]");
  if(st){skTools=st.dataset.sktools==="1";renderSketch();return}
  if(e.target.closest("[data-skrot]")){
    const sk=curSk(); if(!sk)return;
    sk.portrait=!sk.portrait;
    const W=pageW(sk),H=pageH(sk);
    (sk.objs||[]).forEach(o=>{
      o.w=Math.min(o.w,W); o.h=Math.min(o.h,H);
      o.x=Math.max(0,Math.min(W-o.w,o.x));
      o.y=Math.max(hasHeader(sk)?HEADER_H+2:0,Math.min(H-o.h,o.y))});
    saveLocal();renderSketch();return}
  if(e.target.closest("#syncnow")){
    if(conflict){view="data";$$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-data"));return render()}
    syncErr="";retries=0;renderSyncBar();toast("Retrying");ghPush(false);return}
  const sc=e.target.closest("[data-scene]");
  if(sc){sceneTab=sc.dataset.scene;return renderForms()}
  if(e.target.closest("#newsketch")){const sk=newSketch();curSketch=sk.id;view="sketch";
    $$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-sketch"));
    render();return sketchMetaSheet(sk)}
  const sko=e.target.closest("[data-sk]");
  if(sko){curSketch=sko.dataset.sk;view="sketch";
    $$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-sketch"));
    window.scrollTo&&window.scrollTo(0,0);return render()}
  const skc=S.sketches.find(x=>x.id===curSketch);
  if(e.target.closest("[data-skedit]")&&skc)return sketchMetaSheet(skc);
  if(e.target.closest("[data-skpdf]")){
    if(!skc)return;
    if(!(skc.objs||[]).length)return toast("Nothing drawn yet");
    toast("Building the PDF\u2026");
    exportSketch(skc); return;
  }
  const pl=e.target.closest("[data-pal]");
  if(pl){const n=+pl.dataset.pal; palCat = (palCat===n ? -1 : n); return renderSketch()}
  const ad=e.target.closest("[data-add]"); if(ad)return addObj(ad.dataset.add);
  const ol=e.target.closest("[data-olabel]"); if(ol)return labelSheet(objAt(ol.dataset.olabel));
  const ik=e.target.closest("[data-ink]");
  if(ik){const o=objAt(selObj); if(o){o.ink=ik.dataset.ink;saveLocal();renderSketch()} return}
  const or0=e.target.closest("[data-orot0]");
  if(or0){const o=objAt(or0.dataset.orot0);if(o){o.r=0;saveLocal();renderSketch()}return}
  const orr=e.target.closest("[data-orot]");
  if(orr){const o=objAt(orr.dataset.orot);if(o){o.r=((o.r||0)+15)%360;saveLocal();renderSketch()}return}
  const od=e.target.closest("[data-odup]");
  if(od){const o=objAt(od.dataset.odup);if(o&&skc){const c=Object.assign({},o,{id:newId(),x:o.x+24,y:o.y+24});
    if(c.t==="marker")c.n=String(nextMarkerNo(skc));
    skc.objs.push(c);selObj=c.id;saveLocal();renderSketch()}return}
  const lu=e.target.closest("[data-lup]");
  if(lu&&skc){const i=skc.objs.findIndex(x=>x.id===lu.dataset.lup);
    if(i>-1&&i<skc.objs.length-1){const[o]=skc.objs.splice(i,1);skc.objs.splice(i+1,0,o);
      selObj=o.id;saveLocal();renderSketch()}return}
  const ld=e.target.closest("[data-ldn]");
  if(ld&&skc){const i=skc.objs.findIndex(x=>x.id===ld.dataset.ldn);
    if(i>0){const[o]=skc.objs.splice(i,1);skc.objs.splice(i-1,0,o);
      selObj=o.id;saveLocal();renderSketch()}return}
  const of_=e.target.closest("[data-ofwd]");
  if(of_&&skc){const i=skc.objs.findIndex(x=>x.id===of_.dataset.ofwd);
    if(i>-1){skc.objs.push(skc.objs.splice(i,1)[0]);saveLocal();renderSketch()}return}
  const oz=e.target.closest("[data-odel]");
  if(oz&&skc){const o=objAt(oz.dataset.odel);if(!o)return;
    return askConfirm("Delete object","Remove "+SHAPENAME(o.t)+(o.label?" \u201c"+o.label+"\u201d":"")+" from the sketch.","Delete",true,()=>{
      skc.objs=skc.objs.filter(x=>x.id!==o.id);selObj=null;saveLocal();renderSketch()})}
  const os=e.target.closest("[data-osel]");
  if(os){selObj=os.dataset.osel;renderSketch();
    const el=document.querySelector(".canvaswrap");if(el&&el.scrollIntoView)el.scrollIntoView({block:"center"});return}
  if(e.target.closest("[data-skdel]")&&skc)
    return askConfirm("Delete sketch","Everything measured for "+(skc.caseNo||"this sketch")+" is removed. Export first if you need it.","Delete sketch",true,()=>{
      S.sketches=S.sketches.filter(x=>x.id!==skc.id);saveLocal();sceneTab="sketch";go("forms");toast("Deleted")});
  if(e.target.closest("#addform"))return formSheet(null);
  if(e.target.closest("#fmfill")){
    const f=curForm; if(!f)return;
    if(!(f.fields||[]).length){$("#formedit").style.display="block";
      const b=$("#fmedit");if(b)b.style.display="none";
      const s=$("#fmsave");if(s)s.style.display="block";
      return toast("Add fields, then save")}
    const r=newFill(f);closeSheet();prevView="forms";curFill=r.id;view="fill";
    $$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-fill"));
    window.scrollTo&&window.scrollTo(0,0);return render()}
  const fl=e.target.closest("[data-fill]");
  if(fl){prevView="forms";curFill=fl.dataset.fill;view="fill";
    $$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-fill"));
    window.scrollTo&&window.scrollTo(0,0);return render()}
  const fa=e.target.closest("[data-fadd]");
  if(fa){const r=S.fills.find(x=>x.id===curFill);if(!r)return;
    const k=fa.dataset.fadd;if(!Array.isArray(r.values[k]))r.values[k]=[];
    r.values[k].push({});saveLocal();return renderFill()}
  const fr=e.target.closest("[data-frem]");
  if(fr){const r=S.fills.find(x=>x.id===curFill);if(!r)return;
    r.values[fr.dataset.frem].splice(+fr.dataset.tr,1);saveLocal();return renderFill()}
  const fc=e.target.closest("[data-fchk]");
  if(fc){const r=S.fills.find(x=>x.id===curFill);if(!r)return;
    r.values[fc.dataset.fchk]=!r.values[fc.dataset.fchk];saveLocal();return renderFill()}

  const dc=e.target.closest("[data-discard]");
  if(dc){const r=S.fills.find(x=>x.id===dc.dataset.discard);if(!r)return;
    return askConfirm("Discard this form","Nothing is exported and nothing is kept. This can't be undone.","Discard",true,()=>{
      S.fills=S.fills.filter(x=>x.id!==r.id);saveLocal();
      view="forms";$$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-forms"));
      render();toast("Discarded")})}
  const fm=e.target.closest("[data-form]");
  if(fm){const f=S.forms.find(x=>x.id===fm.dataset.form); if(f)formSheet(f); return}
  if(e.target.closest("#bulkopen"))return bulkSheet();
  if(e.target.closest("#addreq")){gapSheet(null);
    const s=$("#gt"); if(s)s.value="request"; return}
  if(e.target.closest("#addgap"))return gapSheet(null);
  const ig=e.target.closest("[data-invg]");
  if(ig){invGroup=ig.dataset.invg;invAll=false;return renderInventory()}
  if(e.target.closest("#invall")){invAll=true;return renderInventory()}
  if(e.target.closest("#modebtn")){
    const cur=S.mode||"auto";
    openSheet(`<h3>Screen mode</h3>
      <p style="margin:0 0 14px;color:var(--ink2);font-size:14.5px;line-height:1.5">
        Desktop mode puts the navigation down the side and opens things in a pane beside the list.</p>
      ${[["auto","Match the screen","Phone layout on a phone, desktop layout on a big screen"],
         ["phone","Handheld","Bottom tabs and one screen at a time, whatever the window size"],
         ["desktop","Desktop","Side navigation and split panes, even in a small window"]]
        .map(([k,t,dd])=>`<button class="modeopt${cur===k?" on":""}" data-mode="${k}">
          <span class="mt">${t}</span><span class="md">${dd}</span>
          ${cur===k?`<span class="mk">&#10003;</span>`:""}</button>`).join("")}
      <button class="btn sec" id="modex" style="max-width:none;margin-top:12px">Close</button>`);
    $("#modex").onclick=closeSheet;
    return}
  const mo=e.target.closest("[data-mode]");
  if(mo){S.mode=mo.dataset.mode;save();applyMode();closeSheet();fitHeader();render();
    return toast(S.mode==="auto"?"Matching the screen":S.mode==="phone"?"Handheld layout":"Desktop layout")}
  if(e.target.closest("#gear")){view="data";
    $$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-data"));
    $("#q").value="";query="";$("#qclear").style.display="none";
    window.scrollTo&&window.scrollTo(0,0);return render()}
  if(e.target.closest("#dlj")){
    const safe=Object.assign({},S);delete safe.gh;delete safe.fills;delete safe.sketches;
    return toast(download(JSON.stringify(safe,null,1),"van-backup-"+today()+".json","application/json")
      ?"Backup downloaded":"Download blocked — use Copy CSV")}
  if(e.target.closest("#dlc")){
    return toast(download(toCSV(),"van-inventory-"+today()+".csv","text/csv")
      ?"CSV downloaded":"Download blocked — use Copy CSV")}
  if(e.target.closest("#cpc")){
    navigator.clipboard&&navigator.clipboard.writeText(toCSV())
      .then(()=>{S.lastBackup=today();save();renderData();toast("Copied")})
      .catch(()=>toast("Copy blocked by the browser"));return}
  if(e.target.closest("#ghconnect")){
    S.ghOwner=$("#gho").value.trim(); S.ghRepo=$("#ghr").value.trim();
    S.gh={owner:$("#gho").value.trim(),repo:$("#ghr").value.trim(),
      path:$("#ghp").value.trim()||"data.json",token:$("#ght").value.trim(),sha:"",last:""};
    if(!ghOn()){S.gh.token="";return toast("Owner, repository and token are all needed")}
    store.set(S);toast("Checking...");
    const localCount=S.items.length;
    (async()=>{
      let r;
      try{ r=await fetch(ghURL()+"?t="+Date.now(),{headers:ghHead(),cache:"no-store"}) }
      catch(err){ S.gh.token="";store.set(S);renderData();return toast("Couldn't reach GitHub") }
      if(r.status===404){ S.gh.sha="";store.set(S);renderData();
        return toast(localCount?"Connected. Push now to upload what's on this phone.":"Connected. Push to create the file.") }
      if(!r.ok){ S.gh.token="";store.set(S);renderData();
        return toast(r.status===401?"Token rejected":r.status===403?"No access to that repo":"GitHub error "+r.status) }
      const j=await r.json();
      let remote; try{ remote=JSON.parse(b64dec(j.content)) }catch(err){ remote=null }
      const remoteCount=remote&&remote.items?remote.items.length:0;
      if(localCount&&remoteCount){
        S.gh.sha=j.sha;store.set(S);renderData();
        return askConfirm("Both have data",
          "This phone has "+localCount+" item"+(localCount===1?"":"s")+" and the repo has "+remoteCount+
          ". They can't be merged — pick which one survives.",
          "Use the repo's copy",true,()=>{
            S.items=remote.items||[];S.comps=remote.comps||[];if(remote.walls)S.walls=remote.walls;
            S.demo=!!remote.demo;S.gh.last=new Date().toISOString();dirty=false;
            store.set(S);render();toast("Pulled "+S.items.length+" items")});
      }
      if(remoteCount){ await ghPull(true); renderData(); return toast("Connected and pulled") }
      S.gh.sha=j.sha;store.set(S);renderData();
      return toast(localCount?"Connected. Push now to upload what's on this phone.":"Connected");
    })();
    return}
  if(e.target.closest("#ghpush")){toast("Pushing...");ghPush(conflict);return}
  if(e.target.closest("#ghpull")){toast("Pulling...");ghPull(false);return}
  if(e.target.closest("#ghoff"))
    return askConfirm("Disconnect sync","The token is removed from this device. Your data stays both in the repo and on this phone.","Disconnect",true,()=>{
      S.gh={owner:"",repo:"",path:"data.json",token:"",sha:"",last:""};store.set(S);
      renderData();toast("Disconnected")});
  if(e.target.closest("#impadd"))return ingest($("#imp").value,false);
  if(e.target.closest("#imprep")){const t=$("#imp").value;
    return askConfirm("Replace everything","Everything currently in the app is discarded and replaced by what you pasted.","Replace",true,()=>ingest(t,true))}
  if(e.target.closest("#cleardemo2"))
    return askConfirm("Clear sample data","The sample compartments and their items are removed. Anything you added yourself stays.","Clear sample",false,()=>{
      clearDemo();renderData();toast("Sample cleared")});
  if(e.target.closest("#wipe"))
    return askConfirm("Erase everything","Every item and compartment is deleted. Download a backup first if you might want any of it.","Erase everything",true,()=>{
      S.items=[];S.comps=[];S.forms=[];S.curLoc="";S.demo=false;save();go("home");toast("Erased")});
  if(e.target.closest("#loaddemo")){loadDemo();return go("home")}
  if(e.target.closest("#cleardemo"))
    return askConfirm("Clear sample data","The 20 sample compartments and their items are removed. Anything you added yourself stays.","Clear sample",false,()=>{
      clearDemo();go("home");toast("Sample cleared")});
  const di=e.target.closest("[data-item]");
  if(di){const it=S.items.find(x=>x.id===di.dataset.item);
    if(it&&it.status==="Not carried"&&!isRequest(it))return gapSheet(it);
    return openItem(di.dataset.item)}
  if(e.target.closest("[data-loc]")){
    S.curLoc=e.target.closest("[data-loc]").dataset.loc; S.pick=false; justAdded=[]; save();
    renderSweep(); const f=$("#q-name")||$("#f-name"); f&&f.focus(); return}
  if(e.target.closest("#add")){
    const nm=$("#f-name").value.trim(); if(!nm)return toast("Item needs a name");
    const dupHere=live().find(i=>i.loc===S.curLoc&&i.name.toLowerCase()===nm.toLowerCase());
    const dupElse=live().find(i=>i.loc!==S.curLoc&&i.name.toLowerCase()===nm.toLowerCase());
    if(dupHere&&!dupOK){
      return askConfirm("Already in "+S.curLoc,
        "\u201c"+dupHere.name+"\u201d is already logged here with "+dupHere.qty+
        " in stock. Adding it again makes a second entry rather than increasing the count.",
        "Add it anyway",false,()=>{dupOK=true;$("#add").click();dupOK=false})}
    if(dupElse&&!dupOK){
      return askConfirm("Already in "+(dupElse.loc||"the van"),
        "\u201c"+dupElse.name+"\u201d is logged in "+(dupElse.loc||"another compartment")+
        ". If the van keeps it in both places that's fine, otherwise you may want to move it instead.",
        "Add it here too",false,()=>{dupOK=true;$("#add").click();dupOK=false})}
    S.lastCat=$("#f-cat").value;S.lastCls=$("#f-cls").value;
    S.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:nm,loc:S.curLoc,
      cat:S.lastCat,cls:S.lastCls,qty:n($("#f-qty").value),par:$("#f-par").value.trim(),
      date:$("#f-date").value||"",status:"Stocked",gapType:"",note:"",steps:[],source:"",
      verified:"",uses:[],rel:[],links:[],fav:false});
    save();renderSweep();toast("Added to "+S.curLoc);const f=$("#f-name");f&&f.focus()}

  const pk=e.target.closest("[data-pick]");
  if(pk){S.pick=pk.dataset.pick==="1";save();renderSweep();
    if(!S.pick){const f=$("#q-name")||$("#f-name");f&&f.focus()} return}
  const qa=e.target.closest("[data-qa]");
  if(qa){S.quick=qa.dataset.qa==="1";save();renderSweep();
    const f=$("#q-name")||$("#f-name"); f&&f.focus(); return}
  if(e.target.closest("#qadd"))return quickAdd();
  const ju=e.target.closest("[data-undo]");
  if(ju){S.items=S.items.filter(i=>i.id!==ju.dataset.undo);
    save();paintJust();refreshSweepList();toast("Removed");return}
});

// quick add: name only, everything else inherited, focus never leaves the field
let justAdded=[];
function quickAdd(){
  const f=$("#q-name"); if(!f)return;
  let nm=f.value.trim(); if(!nm)return toast("Item needs a name");
  let qty=1;
  const m=nm.match(/\s+[x\u00d7*]\s?(\d{1,4})$/i);
  if(m){qty=parseInt(m[1],10)||1; nm=nm.slice(0,m.index).trim()}
  if(!nm)return toast("Item needs a name");
  const it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:nm,loc:S.curLoc,
    cat:S.lastCat||CATS[0][0],cls:S.lastCls||CLASSES[0],qty,par:"",date:"",
    status:"Stocked",gapType:"",note:"",steps:[],source:"",verified:"",
    uses:[],rel:[],links:[],fav:false};
  S.items.push(it); save();
  justAdded.unshift(it.id); justAdded=justAdded.slice(0,6);
  f.value=""; f.focus();
  paintJust(); refreshSweepList();
}
function paintJust(){
  const box=$("#qjust"); if(!box)return;
  const rows=justAdded.map(id=>S.items.find(i=>i.id===id)).filter(Boolean);
  box.innerHTML=rows.length?`<p class="hint" style="margin:14px 0 6px">Just added</p>`
    +rows.map(i=>`<div class="justrow">
      <span class="jn">${esc(i.name)}</span>
      <span class="jq">${esc(i.qty)}</span>
      <button class="jx" data-item="${i.id}">Details</button>
      <button class="jx" data-undo="${i.id}">Undo</button></div>`).join(""):"";
}
function refreshSweepList(){
  const here=live().filter(i=>i.loc===S.curLoc);
  const host=$("#sweeplist"); if(!host)return;
  host.innerHTML=here.length?`<div class="sect">In ${esc(S.curLoc)} — ${here.length}</div><div class="rows">`
    +here.slice().reverse().map(i=>`<button class="row" data-item="${i.id}">
      <span><span class="code">${esc(i.name)}</span><span class="desc">${esc(i.qty)} in stock${i.par?" · par "+esc(i.par):""}</span></span>
      <span class="rt"><span class="chev">&#8250;</span></span></button>`).join("")+`</div>`:"";
}

function placeholder(el,t,b){$(el).innerHTML=`<div class="empty"><strong>${t}</strong><p>${b}</p></div>`}
function fitHeader(){
  const hd=document.querySelector(".hdr"); if(!hd)return;
  if(document.body.classList.contains("wide")){document.body.style.paddingTop="";return}
  document.body.style.paddingTop=hd.offsetHeight+"px";
}
window.addEventListener("resize",()=>{applyMode();fitHeader();render();fitCanvas()});
window.addEventListener("orientationchange",()=>setTimeout(()=>{render();fitCanvas()},250));
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target&&e.target.id==="q-name"){e.preventDefault();return quickAdd()}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName||"");
  if(e.key==="Escape"){
    if($("#sheet")&&$("#sheet").classList.contains("on"))return closeSheet();
    if(skFull)return setFull(false);
    if(query){$("#q").value="";query="";applyQuery();return}
    if(selObj&&view==="sketch"){selObj=null;return renderSketch()}
    return}
  if(typing)return;
  if(e.key==="Enter"&&$("#sheet")&&$("#sheet").classList.contains("on")){
    const b=$("#sheet").querySelector(".btn:not(.sec)"); if(b){e.preventDefault();b.click()} return}
  if(view!=="sketch"||!selObj)return;
  const o=objAt(selObj); if(!o)return;
  const step=e.shiftKey?10:1;
  const nudge=(dx,dy)=>{o.x+=dx;o.y+=dy;saveLocal();renderSketch();e.preventDefault()};
  if(e.key==="ArrowLeft")return nudge(-step,0);
  if(e.key==="ArrowRight")return nudge(step,0);
  if(e.key==="ArrowUp")return nudge(0,-step);
  if(e.key==="ArrowDown")return nudge(0,step);
  if(e.key==="Delete"||e.key==="Backspace"){
    const sk=S.sketches.find(x=>x.id===curSketch); if(!sk)return;
    sk.objs=sk.objs.filter(x=>x.id!==o.id);selObj=null;saveLocal();renderSketch();
    e.preventDefault();return}
  if(e.key==="d"||e.key==="D"){
    const sk=S.sketches.find(x=>x.id===curSketch); if(!sk)return;
    const c=Object.assign({},o,{id:newId(),x:o.x+24,y:o.y+24});
    if(c.t==="marker")c.n=String(nextMarkerNo(sk));
    sk.objs.push(c);selObj=c.id;saveLocal();renderSketch()}
});
window.addEventListener("online",()=>{if(ghOn()&&(dirty||syncErr)){syncErr="";renderSyncBar();ghPush(false)}});
window.addEventListener("offline",()=>renderSyncBar());
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible"||!ghOn())return;
  if(dirty||syncErr){retries=0;ghPush(false)} else ghPull(true);
});
window.addEventListener("orientationchange",()=>setTimeout(fitHeader,200));

const DETAILS=["itemdetail","compdetail","fill","bay"];
const mq=q=>!!(window.matchMedia&&window.matchMedia(q).matches);
function applyMode(){
  const m=S.mode||"auto";
  const w1 = m==="desktop" || (m!=="phone" && mq("(min-width:820px)"));
  const w2 = m==="desktop" || (m!=="phone" && mq("(min-width:1000px)"));
  document.body.classList.toggle("wide",w1);
  document.body.classList.toggle("xwide",w2);
}
const wideNow=()=>document.body.classList.contains("xwide");
function renderView(v){
  if(v==="search")return renderSearch();
  if(v==="itemdetail")return renderItemDetail();
  if(v==="bay")return renderBay();
  if(v==="compdetail")return renderCompDetail();
  if(v==="data"){renderData();return fitHeader()}
  if(v==="print")return renderPrint();
  if(v==="home")return renderHome();
  if(v==="compartments")return renderComps();
  if(v==="sweep")return renderSweep();
  $("#title").textContent=(TABS.find(t=>t[0]===v)||[,""])[1];
  if(v==="sketch")return renderSketch();
  if(v==="fill")return renderFill();
  if(v==="forms")return renderForms();
  if(v==="inventory")return renderInventory();
  if(v==="guide")return renderGuide();
}
function render(){
  buildTabs();renderDemoBar();renderSyncBar();
  const main=document.querySelector(".main");
  const master=DETAILS.includes(view)&&prevView&&prevView!==view
    &&!["itemdetail","fill"].includes(prevView)?prevView:null;
  const split=wideNow()&&!!master;
  $$(".view").forEach(s=>{s.classList.remove("pane-master","pane-detail");
    s.classList.toggle("on",s.id==="v-"+view||(split&&s.id==="v-"+master))});
  if(main)main.classList.toggle("split",split);
  if(split){
    $("#v-"+master).classList.add("pane-master");
    $("#v-"+view).classList.add("pane-detail");
    renderView(master);
  }
  renderView(view);
}
applyMode();render();fitHeader();
if(typeof requestAnimationFrame==='function')requestAnimationFrame(fitHeader);
if(ghOn())ghPull(true).then(()=>renderSyncPill());
</script>
